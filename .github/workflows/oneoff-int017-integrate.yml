name: Oneoff INT017 integrate Slovak verified source
on:
  push:
    paths:
      - .github/workflows/oneoff-int017-integrate.yml
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Cross-check source tables and append catalogs
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,urllib.request,base64,json,csv,io,re,hashlib,collections
          repo=os.environ["GH_REPOSITORY"];token=os.environ["GH_TOKEN"]
          h={"Authorization":"Bearer "+token,"User-Agent":"Verified-INT017-Archive"}
          root="prison-research-archive/00_catalog/"
          pp=root+"progress/"
          source="space-archive/extra/stp8/Slovakia_II_Cinnost_ZVJS_2021.pdf"
          blob="1d6cfcddd12bba2aa17577343781a1e7276904ec"
          sha256="8e45a3b5a627e26734b93b7d532619a8c3cb7406c0cf623897c51c6fb69749a3"
          upstream="https://www.justice.gov.sk/dokumenty/2025/03/II.-Cinnost-Zboru-vazenskej-a-justicnej-straze-2021.pdf"
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=150) as r:return json.load(r)
          def blobtxt(sha):return base64.b64decode(get("https://api.github.com/repos/"+repo+"/git/blobs/"+sha)["content"]).decode("utf-8-sig")
          def filetxt(path):return base64.b64decode(get("https://api.github.com/repos/"+repo+"/contents/"+path)["content"]).decode("utf-8-sig")
          def parse(s):return list(csv.DictReader(io.StringIO(s)))
          integ=json.loads(filetxt(pp+"INT-017_original_PDF_integrity_v1.json"))
          assert integ["sha256"]==sha256 and integ["git_sha1"]==blob and integ["bytes"]==2013675 and integ["physical_pages"]==91
          assert integ["publisher"]["byte_identical"]==True and integ["publisher"]["tls_verified"]==True
          reg=parse(blobtxt("8711559a55c14fefc13be5593f6fe36c23cbb867"))
          mb=parse(blobtxt("142aadef6e6b869ac20707d6180703b0c50692ab"))
          assert len(reg)==1472 and reg[-1]["record_id"]=="R01472" and len(mb)==79 and mb[-1]["break_id"]=="MB-079"
          tab2=parse(filetxt(pp+"INT-017_Table2_2018_2021_custody_annual_avg_Dec31_v1.csv"))
          tab15=parse(filetxt(pp+"INT-017_Table15_24_unit_2021_annual_avg_remand_sentenced_v1.csv"))
          tab31=parse(filetxt(pp+"INT-017_Table31_19_org_units_budget_cost_2019_2021_v1.csv"))
          tab32=parse(filetxt(pp+"INT-017_Table32_22_prison_and_subunit_capacity_feeding_2021_v1.csv"))
          tab34=parse(filetxt(pp+"INT-017_Table34_prisoner_employment_18_units_2021_v1.csv"))
          scalar=parse(filetxt(pp+"INT-017_national_finance_personnel_population_source_values_2019_2021_v1.csv"))
          index=parse(filetxt(pp+"INT-017_50_tables_page_heading_index_visual_corrected_v2.csv"))
          assert [len(x) for x in (tab2,tab15,tab31,tab32,tab34,scalar,index)]==[4,24,19,22,18,42,50]
          assert [int(x["table_number"]) for x in index]==list(range(1,51))
          assert next(x for x in index if x["table_number"]=="17")["pdf_physical_page"]=="64"
          qa=[]
          def check(label,actual,expected,tol=1.e-7):
            passed=abs(float(actual)-float(expected))<=tol
            qa.append({"test":label,"value":actual,"expected":expected,"passed":passed})
            if not passed:raise ValueError(("QA_FAIL",label,actual,expected))
          for x in tab2:
            y=x["calendar_year"]
            check("tab2_31dec_remand_plus_sentenced_"+y,int(x["remand_31_dec"])+int(x["sentenced_31_dec"]),int(x["all_custody_31_dec"]))
            check("tab2_mean_remand_plus_sentenced_"+y,int(x["remand_annual_average"])+int(x["sentenced_annual_average"]),int(x["all_custody_annual_average"]))
          for x in tab15:
            check("tab15_site_status_sum_"+x["source_row_order"],int(x["2021_avg_pretrial_remand_persons_rounded"])+int(x["2021_avg_sentenced_persons_rounded"]),int(x["2021_avg_all_persons_rounded"]))
          for field,expect in [("2021_avg_pretrial_remand_persons_rounded",1528),("2021_avg_sentenced_persons_rounded",8811),("2021_avg_all_persons_rounded",10339)]:
            check("tab15_column_"+field,sum(int(x[field]) for x in tab15),expect)
          for field,expect in [("current_budget_expense_source111_2019_eur",194074839),("current_budget_expense_source111_2020_eur",219077355),("current_budget_expense_source111_2021_eur",234073567),("average_prisoner_2021_for_budget_denominator_rounded_persons",10338)]:
            check("tab31_col_"+field,sum(int(x[field]) for x in tab31),expect)
          for field,expect in [("accommodation_capacity_as_at_2021_12_31_places",11621),("average_daily_persons_fed_2021",10342.4)]:
            check("tab32_col_"+field,sum(float(x[field]) for x in tab32),expect,1.e-5)
          for x in tab32:
            check("tab32_site_pct_"+x["source_row_order"],round(100*float(x["average_daily_persons_fed_2021"])/float(x["accommodation_capacity_as_at_2021_12_31_places"]),2),float(x["source_reported_capacity_usage_pct"]),.011)
          for field,expect in [("year_2021_average_all_in_custody_persons",10338),("average_eligible_for_prison_work_persons",6400),("average_assigned_to_work_persons",4104)]:
            check("tab34_col_"+field,sum(int(x[field]) for x in tab34),expect)
          for x in tab34:
            check("tab34_site_pct_"+x["source_row_order"],round(100*float(x["average_assigned_to_work_persons"])/float(x["average_eligible_for_prison_work_persons"]),2),float(x["assigned_share_of_eligible_pct_source"]),.011)
          v={x["source_indicator_code"]:float(x["observed_source_number"]) for x in scalar if x["source_period"] in ("2021","2021-12-31")}
          check("source_actual_current_plus_capital",v["all_2021_current_expenses_all_sources"]+v["all_2021_capital_expenses_all_sources"],v["all_2021_actual_expenses_all_funding_sources"],.0001)
          check("source_current_budget_categories_sum",sum(v[k] for k in ["total_wages_salaries_personal_payments_all_sources","insurance_social_payments_all_sources","goods_services_expenses_all_sources","current_transfers_all_sources"]),v["all_2021_current_expenses_all_sources"],.0001)
          check("source_staff_yearend",v["yearend_uniformed_service_officers"]+v["yearend_civilian_employees"],v["yearend_staff_all_agency"])
