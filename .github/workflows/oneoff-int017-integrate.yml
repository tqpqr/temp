            ("Table31",tab31,19,8,"PDF physical p73 source Table31 19 org rows 2019-2021 111 expenditures, day rates and 2021 avg people; headquarters positive costs without prisoners","MB-080;MB-084;MB-087"),
            ("Table32",tab32,22,3,"PDF physical p74 source Table32 22 accommodation subunits at Dec31, 2021 mean fed, 2021 utilization; includes Trenčín 130.06pct","MB-081;MB-082;MB-084"),
