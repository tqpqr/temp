            "original_source_a":source,"git_sha_a":blob,"original_cell_a":cell_a,"original_source_b":source,"git_sha_b":blob,"original_cell_b":cell_b,
            "exact_observation":explanation,"existing_evidence_artifact":existing_docs,"causal_explanation_status":cause,
            "triage_status":status,"must_not_do":avoid,"resumption_or_next_check":next_check})
            mb.append(row)
          assert len(mb)==87 and len({r["break_id"] for r in mb})==87
          # Append high-precision complete raw evidence with no duplicate pseudo-national observations.
          fields=list(reg[0])
          refbase="00_catalog/progress/INT-017_Slovakia_ZVJS_2021_verified_original_source_audit_v1.md;00_catalog/progress/INT-017_original_PDF_integrity_v1.json"
          base={"source_domain":"SK_ZVJS_STAT_ROCENKA_2021","source_reference":refbase,
            "original_source_path":source,"original_git_blob_sha1":blob,
            "coverage_evidence":"EXACT_ARCHIVED_BLOB_SHA1_SHA256_91_PAGES_OFFICIAL_MOJ_BYTE_IDENTICAL_50_TABLE_INDEX",
            "publication_vintage":"SK_ZVJS_2021_YEARBOOK_COVER_APR_2022;ARCHIVAL_PDF_CREATED_2022_09_02;CURRENT_OFFICIAL_URL_IN_2025_03_NOT_OBSERVED_YEAR",
            "official_upstream_url":upstream,
            "external_binary_identity":"EXACT_TLS_VALIDATED_OFFICIAL_BYTE_IDENTICAL_SHA256_"+sha256,
            "field_coverage_status":"ORIGINAL_EXACT_SOURCE_WITH_DATES_AND_SCOPE_ANCHORED",
            "semantic_code_definition_status":"ORIGINAL_SOURCE_MEASUREMENT_GRAIN_AND_PERIMETER_SPECIFIED"}
          def add(values):
            rec=dict.fromkeys(fields,"")
            rec.update(base);rec.update(values)
            rec["record_id"]="R%05d"%(1473+len(reg)-1472)
            reg.append(rec)
          excluded={
           "annual_average_remand","annual_average_sentenced","annual_average_all_in_custody",
           "end_year_remand","end_year_sentenced","end_year_all_in_custody"
          }
          for x in scalar:
            if x["source_indicator_code"] in excluded:continue
            code=x["source_indicator_code"]
            scope="MB-080" if "expense" in code or "income_" in code or "current_cost" in code or "budget" in code else "MB-085" if "staff_" in code or "officers" in code or "employees" in code or "positions" in code else "MB-086" if "work" in code else "MB-081;MB-082" if "fed" in code or "capacity" in code or "Trencin" in code else "MB-083" if "facility_sum" in code else ""
            add({"record_type":"VERIFIED_ORIGINAL_SOURCE_SCALAR_DISTINCT_CALENDAR_YEAR_OR_DATE",
             "indicator_code":"SK_ZVJS_"+code+"_"+re.sub("[^0-9A-Za-z]+","_",x["source_period"]),
             "indicator_name_original":code,
             "indicator_unit":x["unit"],"territorial_level":"Slovakia ZVJS full agency or source-scoped unit as field-labelled",
             "temporal_grain":"CALENDAR_YEAR_2021_SOURCE_OR_31_DEC_SNAPSHOT_OR_HISTORIC_2019_2020_AS_LABELLED",
             "first_period_recorded":x["source_period"],"last_period_recorded":x["source_period"],
             "listed_periods_exact":x["source_period"],"distinct_nominal_years":"1",
             "reporting_window_type":"EXACT_SOURCE_PERIOD_FROM_FIELD",
             "numeric_evidence":x["observed_source_number"],
             "source_reference":refbase+";00_catalog/progress/INT-017_national_finance_personnel_population_source_values_2019_2021_v1.csv",
             "source_cell_anchor":x["original_source_page_anchor"],
             "important_limitations":x["boundary_and_method_note"],
             "observed_value_raw":x["observed_source_number"],
             "measurement_status":"ARCHIVED_SOURCE_OFFICIAL_BINARY_VERIFIED_EXACT_SCALAR","linked_break_ids":scope,"number_of_source_records":"1"})
          assert len(reg)-1472==36,(len(reg)-1472)
          popfields=["remand_31_dec","remand_annual_average","sentenced_31_dec","sentenced_annual_average","all_custody_31_dec","all_custody_annual_average"]
          for col in popfields:
            pairs=";".join(x["calendar_year"]+"="+x[col] for x in tab2)
            add({"record_type":"VERIFIED_ORIGINAL_4_CALENDAR_YEAR_SOURCE_POPULATION_SERIES",
