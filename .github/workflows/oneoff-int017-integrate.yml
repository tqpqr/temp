          check("source_prison_labour_share",float((__import__("decimal").Decimal(str(v["average_prisoners_assigned_work"]))/__import__("decimal").Decimal(str(v["average_eligible_for_prison_work"]))*100).quantize(__import__("decimal").Decimal("0.01"),rounding=__import__("decimal").ROUND_HALF_UP)),v["prisoner_work_placement_percentage_of_eligible"])
          check("source_cost_per_day",round(234073567/(10338*365),2),v["current_cost_source111_per_prisoner_per_day"])
          check("capacity_use_mean_fed",round(100*10342.4/11621,2),89)
          # New MB boundaries; do NOT fabricate source corrections or timestamp alignments.
          existing_docs="progress/INT-017_Slovakia_ZVJS_2021_verified_original_source_audit_v1.md;progress/INT-017_original_PDF_integrity_v1.json"
          issues=[
          ("MB-080","SK ZVJS source 111 budget vs all funding sources and HQ","ANNUAL_CURRENT_SOURCE111_WITH_HQ_VS_ALL_FUNDING_CURRENT_CAPITAL_EXPENDITURE","2019–2021 Table31","2021 all-source annual report budget","PDF p73 Table31 source111 current 2021 EUR234073567 including HQ EUR16681254","PDF p23-24 all-source 2021 current EUR237071400.75 plus cap EUR9511611.77 =EUR246583012.52","Budget source111 for Table31 includes nonzero HQ costs attributed to zero prisoners, while all-source cost includes other source current and capital; comparing directly as equivalent cost per person or place invalid.","DEFINITION_AND_NATIONAL_ACCOUNTING_PERIMETER_VERIFIED","KEEP_DISTINCT_FINANCIAL_PERIMETERS","Do not treat cost per prisoner 62.03 as full all-source operating+capital per person; HQ expenditures are not zero when HQ prison stock zero.","Preserve 111 vs all-source annual cost and avoid HQ denominator division."),
          ("MB-081","SK ZVJS capacity and mean-fed ratio","YEAR_END_ACCOMMODATION_CAPACITY_VS_CALENDAR_AVERAGE_PERSONS_FED","2021-12-31 source places","2021 mean fed prisoners","PDF p74 Table32 capacity11621 (date Dec31)","PDF p74 Table32 fed mean10342 ratio89.00 and Trenčín 212/163=130.06","Reported utilization uses mixed grain yearend places and yearly average fed population; single establishment Trenčín p74 exceeds100 because source ratio is a valid arithmetic division not contemporaneous bed occupancy proof.","SOURCE_RATIO_ARITHMETIC_CONFIRMED_OPERATIONAL_SCOPE_UNVERIFIED","DO_NOT_READ_RATIO_AS_SAME_DAY_PHYSICAL_OCCUPANCY","Never assume Trenčín 130.06 implies actual same-day inmates per 163 housing beds. Hospital and feeding scopes may matter; exact cause unknown.","Need aligned site/day occupancy and prison-place concepts."),
          ("MB-082","SK ZVJS 2021 average feeding vs custody populations","FED_PRISONER_MEAN_NOT_EQUAL_TO_AVERAGE_CUSTODY_STOCK","2021 Table2 annual mean prisoners","2021 Table32 annual mean fed persons","PDF p50 Table2 yearly custody mean10338","PDF p74 Table32 feed mean10342.4 rounded10342","Separate feeding activity count 10342/10342.4 from published mean custody stock 10338, differential about+4; underlying daily feeding/person rules not determined; 3,775,007 full-day rations also count services not individuals.","SOURCE_LITERALS_CONFIRMED_UNEXPLAINED_EXACT_CAUSE","DISTINGUISH_FOOD_SERVICE_FROM_CUSTODY_STOCK","Do not substitute fed average as annual prisoner denominator or call difference 4 statistical correction.","Cross-check daily food and establishment occupancy series before reconciling."),
          ("MB-083","SK ZVJS Table15 site rounded averages vs Table2 nation","SUM_OF_24_ROUNDED_SITE_STATUS_MEANS_DOES_NOT_EQUAL_NATIONAL_AVERAGES","2021 Table15 24 rows","2021 Table2 national custody means","PDF p63 Table15:1528 remand+8811 sentenced=10339","PDF p50 Table2:1530 remand+8808 sentenced=10338","SUM site averaged rounded columns differs from nation (remand -2, sentenced +3,total +1). Rounding and site partition time weighting plausible but exact decomposition unproven.","ARITHMETIC_DIFFERENCE_CONFIRMED_EXPLANATION_UNPROVEN","RETAIN_EXACT_SOURCE_SITE_AND_NATIONAL_VALUES","Do not force 2021 national denominator to10339 or adjust institution cells.","Need exact unrounded site daily means if numeric reconciliation required."),
          ("MB-084","SK ZVJS statistical institutional universes","PARENT_BRANCH_HQ_AND_SERVICE_SITE_ROWS_NOT_SAME_ENTITY_UNIVERSE","2021 Table15 24 named source rows","2021 Table31 19 Table32 22 and Table34 18 rows","PDF p63 Table15 24 source branch/parent rows","PDF p73-78 Tables31/32/34 facility 19/22/18 rows","Parent prisons and OO branch/hospital/accommodation rows aggregate differently; Table31 contains General Directorate; Tables15/32 expose organizational subunits; Table34 excludes HQ. No 1:1 join by raw row count.","HIERARCHY_SCOPE_VERIFIED_CROSS_TABLE_MAPPING_NOT_FULLY_RECONCILED","NOT_INDEPENDENT_24_PRISONS","Don't infer 24 independent prisons, blindly join/aggregate disjoint institution costs and child facility capacity.","Build explicit parent/child crosswalk, preserve original labels/IDs."),
          ("MB-085","SK ZVJS all-service agency staffing","SYSTEMIZED_VS_YEAR_END_VS_ANNUAL_STAFF_AND_PRISON_VS_JUSTICE_GUARDS","2021 formal posts5831","2021 yrend5576 annual mean5512.52","PDF p85 Table45 posts5831 and project admin65","PDF p85 Table45 2021-12-31 actual5576 officers4872 civilian704, annual mean5512.52 officers4799.57 civilian712.95","Authorized posts, observed year-end people, and annual average staff counts are not interchangeable; ZVJS uniformed personnel also provide judicial/court guard service beyond custody.","SOURCE_YEAR_TIME_AND_ROLE_SCOPE_CONFIRMED","NO_PRISON_GUARD_OFFICER_COUNT_FROM_AGENCY_TOTAL","Do not attribute all officers to prison housing or use approved posts as working 2021 staff.","Obtain facility/role staff breakdown if future research requires it."),
          ("MB-086","SK ZVJS inmate employment rate","ELIGIBLE_FOR_WORK_DENOMINATOR_NOT_ALL_CUSTODY","2021 Table34 average all custody10338","2021 work eligible6400 assigned4104","PDF p78 Table34 eligible6400 assigned4104 pct64.13","PDF p78 Table34 all custody avg10338","Employed share64.13% calculated4104/6400 eligible subset, not 4104/10338 all custody; remuneration EUR1.37/h among workers and cannot represent all prisoners.","ARITHMETIC_AND_ELIGIBILITY_SOURCE_VERIFIED","DISTINGUISH_DENOMINATORS","Do not call 64.13% share of all custody population or impute work ineligible groups.","Use exact employment and eligibility universe."),
          ("MB-087","SK ZVJS prior period facility rates","PRIOR_YEAR_CURRENT_EUR_PER_PRISONER_DAY_HAS_ONLY_ROUNDED_RATE_NO_EXACT_SITE_MEANS","2019–2020 Table31","2021 Table31","PDF p73 Table31 2019/20 facilities expenditures and EUR/person/day rates","PDF p73 Table31 2021 facilities expenses/yearly mean inmates and EUR/person/day rates","Source site averages absent as raw data for 2019/2020; reversing expenses/daily rates would produce approximate implied denominators due rounded rates and unknown year-specific leap-day or accrual assumptions.","SOURCE_TABULAR_MEASUREMENT_RESTRICTION_CONFIRMED","DO_NOT_MAKE_EXACT_2019_2020_SITE_POP_FROM_RATE","Do not populate 2019/2020 site prisoner stocks or facility elasticities with inferred exact values.","Find earlier original annual yearbooks for precise site avg rates.")
          ]
          mbfields=list(mb[0])
          for id,geo,typ,earlier,later,cell_a,cell_b,explanation,cause,status,avoid,next_check in issues:
            row=dict.fromkeys(mbfields,"")
