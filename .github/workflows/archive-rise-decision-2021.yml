name: Archive RISE 2021 decision once
on:
  push:
    paths:
      - .github/workflows/archive-rise-decision-2021.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive-original-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and validate official PDF
        env:
          TARGET: prison-research-archive/03_international/Finland/original_sources/RISE_Dnro_12-280-2021_decision_2021-11-22.pdf
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.sttinfo.fi/data/attachments/00037/3fe38edf-552e-428d-a53c-31b19201c702.pdf'
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 90 --user-agent 'archive-academic-research/1.0' "$URL" --output decision.pdf
          test "$(head -c 5 decision.pdf)" = '%PDF-'
          python3 -m venv .verify-pdf
          .verify-pdf/bin/pip install --disable-pip-version-check --quiet pypdf
          .verify-pdf/bin/python - <<'PY'
          from pypdf import PdfReader
          p = PdfReader('decision.pdf', strict=True)
          print('Valid PDF; pages =', len(p.pages))
          assert len(p.pages) == 7, 'Expected original 7-page RISE decision'
          text = '\\n'.join((page.extract_text() or '') for page in p.pages)
          assert '12/280/2021' in text, 'Expected RISE docket missing'
          PY
          sha256sum decision.pdf
          python3 - <<'PY'
          import os, base64, urllib.request, json
          path=os.environ['TARGET']
          content=open('decision.pdf','rb').read()
          url='https://api.github.com/repos/'+os.environ['GH_REPOSITORY']+'/contents/'+path
          payload=json.dumps({
            'message':'archive: preserve seven-page authentic RISE 2021 Finnish capacity decision PDF',
            'content':base64.b64encode(content).decode(),
            'branch':'main'
          }).encode()
          req=urllib.request.Request(url,data=payload,method='PUT',headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'Content-Type':'application/json'
          })
          with urllib.request.urlopen(req,timeout=60) as r: print(r.status, r.read(350).decode())
          PY
