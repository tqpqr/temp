name: Oneoff INT019 Estonia gov CPT response integration
on:
  push:
    paths:
      - .github/workflows/oneoff-int019-integrate.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify exact source text on 47 pages and promote dated facts
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,base64,json,io,csv,urllib.request,re,collections
          repo=os.environ["GH_REPOSITORY"];tok=os.environ["GH_TOKEN"]
          h={"Authorization":"Bearer "+tok,"User-Agent":"INT019-SourceEvidence"}
          prefix="prison-research-archive/00_catalog/"
          prog=prefix+"progress/"
          source="space-archive/extra/stp8/Estonia_CPT-Inf_2024_27.pdf"
          sha="bd9949bfe933fbf00c745a4a8b4fa39562492e4b"
          sha256="37a96647b2abddf0128e0046409bd80254aa7ffc793d1a034f6f25299d7d0ef9"
          mirror="https://www.oiguskantsler.ee/sites/default/files/v%C3%A4%C3%A4rkohtlemine/2024-27-inf-en%20Response.pdf"
          def api(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=140) as rr:return json.load(rr)
          def getfile(path):
            return base64.b64decode(api("https://api.github.com/repos/"+repo+"/contents/"+path)["content"]).decode("utf-8-sig")
          def getblob(blob):
            return base64.b64decode(api("https://api.github.com/repos/"+repo+"/git/blobs/"+blob)["content"]).decode("utf-8-sig")
          def parse(s):return list(csv.DictReader(io.StringIO(s)))
          reg=parse(getblob("d3f5748f92f4e72f2e590dfb0b172848eb2836b7"))
          mb=parse(getblob("06e11e567db6cc1efae80656790566f4c52b93a8"))
          assert len(reg)==1540 and reg[-1]["record_id"]=="R01540"
          assert len(mb)==91 and mb[-1]["break_id"]=="MB-091"
          orig=json.loads(getfile(prog+"INT-019_original_PDF_integrity_v1.json"))
          mirror_verify=json.loads(getfile(prog+"INT-019_original_PDF_integrity_mirror_text_v3.json"))
          assert orig["archived_bytes"]==1058916 and orig["archived_git_sha1"]==sha and orig["archived_sha256"]==sha256 and orig["pages"]==47
          assert mirror_verify["publisher_comparison"]["identical_bytes"] is False
          assert mirror_verify["publisher_comparison"]["tls_verified"] is True
          assert mirror_verify["publisher_comparison"]["all_page_text_identical"] is True
          assert len(mirror_verify["publisher_comparison"]["page_text_exact_matches"])==47
          assert all(mirror_verify["publisher_comparison"]["page_text_exact_matches"])
          data=parse(getfile(prog+"INT-019_Estonia_CPT_government_2023_2024_dated_indicator_observations_v1.csv"))
          assert len(data)==33
          assert sum(row["unit"]=="source_event_flag" for row in data)==1
          def val(site,metric):
            sub=[r for r in data if r["geography_or_institution"]==site and r["source_indicator"]==metric]
            assert len(sub)==1,(site,metric)
            return float(sub[0]["value_as_reported"])
          expected=[
          ("2024_officer_FTE_3site",sum(val(k,"prison_officers_FTE_filled") for k in ["Tallinn Prison","Viru Prison","Tartu Prison"]),709),
          ("2024_officer_positions_3site",sum(val(k,"prison_officer_authorized_positions") for k in ["Tallinn Prison","Viru Prison","Tartu Prison"]),821),
          ("2024_officer_posts_minus_FTE",sum(val(k,"prison_officer_authorized_positions")-val(k,"prison_officers_FTE_filled") for k in ["Tallinn Prison","Viru Prison","Tartu Prison"]),112),
          ("visit_health_FTE",sum(val(k,"health_staff_FTE_filled") for k in ["Tallinn Prison","Viru Prison","Tartu Prison"]),75.3),
          ("visit_health_posts",sum(val(k,"health_staff_theoretical_posts") for k in ["Tallinn Prison","Viru Prison","Tartu Prison"]),108.8),
          ("2023_broad_attack_threat_events",sum(val(k,"cases_physical_assault_or_imminent_threat") for k in ["Tallinn Prison","Viru Prison","Tartu Prison"]),482),
          ("CPT_vs_govt_closed_places",val("Estonia closed prison estate","closed_prison_places_government")-val("Estonia closed prison estate","closed_prison_official_places_CPT"),120)]
          for name,calc,correct in expected:
            assert abs(calc-correct)<1e-6,(name,calc,correct)
          fields=list(reg[0])
          base={"source_domain":"EE_GOVT_RESPONSE_TO_CPT_INF_2024_27",
            "source_reference":"00_catalog/progress/INT-019_Estonia_CPT_2024_27_source_audit_v1.md;00_catalog/progress/INT-019_original_PDF_integrity_mirror_text_v3.json",
            "original_source_path":source,"original_git_blob_sha1":sha,
            "publication_vintage":"2024_09_26_PUBLICATION_RESPONSE_TO_2023_05_29_THRU_06_08_CPT_VISIT",
            "official_upstream_url":mirror,
            "external_binary_identity":"ARCHIVED_SHA256_"+sha256+";OFFICIAL_CHANCELLOR_MIRROR_PDF_DIFFERENT_475_BYTES_BUT_EXACT_TEXT_ALL_47_PAGES",
            "coverage_evidence":"ARCHIVED_SHA1_SHA256_47_PDF_PAGES_EXACT_ALL_SOURCE_TEXT_IDENTICAL_TO_OFFICIAL_ESTONIAN_HOST",
            "field_coverage_status":"GOVERNMENT_RESPONSE_WITH_CPT_QUOTED_OBSERVATIONS_DATED_BY_ORIGINAL_TEXT",
            "semantic_code_definition_status":"GOVT_RESPONSE_VS_QUOTED_CPT_AUTHORSHIP_AND_TIME_WINDOWS_CONSERVED"}
          def add(changes):
            rec=dict.fromkeys(fields,"")
            rec.update(base);rec.update(changes)
            rec["record_id"]="R%05d"%(1541+len(reg)-1540)
            assert all(k in fields for k in changes)
            reg.append(rec)
          def slug(v):return re.sub("[^a-zA-Z0-9]+","_",v).strip("_")
          for r in data:
            if r["unit"]=="source_event_flag":continue
            textmetric=r["source_indicator"];who=r["attribution"]
            scope="MB-093" if "capacity" in textmetric or "places" in textmetric or "use_pct" in textmetric else "MB-094" if "prison_population" in textmetric or "prisoners_closed" in textmetric or "incarceration_rate" in textmetric else "MB-095" if "officer" in textmetric or "health_staff" in textmetric else "MB-097"
            if "health_staff" in textmetric:scope+=";MB-096"
            if "health_staff" in textmetric or "officer" in textmetric or "FTE" in textmetric:scope+=";MB-095"
            if scope=="MB-095;MB-095":scope="MB-095"
            add({"record_type":"DATED_CPT_QUOTATION" if who.startswith("CPT_") else "DATED_ESTONIAN_GOVERNMENT_REPLY",
                "indicator_code":"EE_CPT2024_27_"+slug(r["geography_or_institution"])+"_"+slug(textmetric)+"_"+slug(r["observation_period"]),
                "indicator_name_original":textmetric,
                "indicator_unit":r["unit"],"territorial_level":r["geography_or_institution"],
                "temporal_grain":r["grain"],
                "first_period_recorded":r["observation_period"],
                "last_period_recorded":r["observation_period"],
                "listed_periods_exact":r["observation_period"],
                "distinct_nominal_years":"1",
                "reporting_window_type":"PUBLICATION_2024_09_26_OBSERVATION_"+r["grain"],
                "numeric_evidence":r["value_as_reported"],
                "source_cell_anchor":"PDF physical p"+r["physical_pdf_page"]+" quoted CPT paragraph or official government response",
                "source_reference":base["source_reference"]+";00_catalog/progress/INT-019_Estonia_CPT_government_2023_2024_dated_indicator_observations_v1.csv",
                "important_limitations":r["scope_and_vintage_warning"]+"; literal source attribution="+who+"; not an annual-statistical source",
                "observed_value_raw":r["value_as_reported"],
                "measurement_status":"PUBLISHED_QUOTED_CPT_NUMERIC" if who.startswith("CPT_") else "PUBLISHED_GOVT_RESPONSE_NUMERIC",
                "linked_break_ids":"MB-092;"+scope,
                "number_of_source_records":"1"})
          assert len(reg)==1572 and reg[-1]["record_id"]=="R01572"
          add({"record_type":"REPORTED_FUTURE_INSTITUTIONAL_FINANCING_CHANGE_NOT_PROVEN_EXECUTED",
            "indicator_code":"EE_CPT_2024_27_reported_2024_07_01_prison_healthcare_funding_shift",
            "indicator_name_original":"Transfer of prison healthcare organization and financing from Ministry of Justice to social/health system, source planned date",
            "indicator_unit":"documented_institutional_event_not_expenditure",
            "territorial_level":"Estonia national prisons and Social Affairs / Health Insurance Fund",
            "temporal_grain":"SOURCE_PROSPECTIVE_DATE_2024_07_01_AS_DESCRIBED_IN_2024_REPLY",
            "first_period_recorded":"2024-07-01",
            "last_period_recorded":"2024-07-01",
            "listed_periods_exact":"2024-07-01","distinct_nominal_years":"1",
            "reporting_window_type":"PENDING_OR_REPORTED_REFORM_NOT_FINANCIAL_OBSERVATION",
            "numeric_evidence":"NOT_A_NUMERIC_SPENDING_OBSERVATION",
            "source_cell_anchor":"PDF physical p20 govt reply on organization and financing of prison healthcare",
            "important_limitations":"Report's language prospective; cannot claim transfer fully executed on time or invent numeric cost discontinuity",
            "measurement_status":"PRIMARY_SOURCE_REPORTED_INSTITUTIONAL_POLICY_BREAK_NOT_EXECUTION_PROVEN",
            "linked_break_ids":"MB-096",
            "number_of_source_records":"1"})
          add({"record_type":"CPT_GOVERNMENT_RESPONSE_DOCUMENT_WITH_TEXT_IDENTICAL_OFFICIAL_MIRROR",
            "indicator_code":"EE_CPT_INF_2024_27_47pp_original_response_source_dossier",
            "indicator_name_original":"Government reply to CPT report 26; distinct authorship, visit 2023, follow-up April2024",
            "indicator_unit":"nonadditive_source_provenance",
            "territorial_level":"Estonia prison/police/psychiatric/military custodial domains",
            "temporal_grain":"MIXED_2021_2022_2023_2024_AND_GOVT_RESPONSE",
            "first_period_recorded":"2021","last_period_recorded":"2024-09-26",
            "listed_periods_exact":"2021;2022;2023-05-29/2023-06-08;2023;2024-04-18;2024-09-26",
            "distinct_nominal_years":"4",
            "reporting_window_type":"SOURCE_DOES_NOT_DEFINE_NATIONAL_YEAR_MEAN",
            "numeric_evidence":"EXACT_47_PDF_PAGE_TEXTS_MIRROR_MATCH;BINARY_DIFF_475_BYTES;33_SOURCE_OBS_32_NUMERIC",
            "source_cell_anchor":"Original cover PDF1, CPT visit p12, prison officers p26, health financing p20",
            "important_limitations":"Not separate CPT report 26, exact rm.coe.int byte match blocked HTTP403, official Chancellor of Justice different PDF envelope but textual equality 47/47",
            "measurement_status":"ORIGINAL_ARCHIVE_CONTENT_AUTHENTICATED_NOT_OFFICIAL_BINARY_EQUIVALENT",
            "linked_break_ids":"MB-092",
            "number_of_source_records":"47"})
          assert len(reg)==1574 and reg[-1]["record_id"]=="R01574"
          sourcebr="progress/INT-019_Estonia_CPT_2024_27_source_audit_v1.md;progress/INT-019_original_PDF_integrity_mirror_text_v3.json"
          problems=[
            ("MB-092","Estonia CPT report vs Estonian-government response","PUBLICATION_YEAR_AND_QUOTED_AUTHORSHIP_NOT_OBSERVATION_YEAR_OR_CPT_AUTHORED_ORIGINAL","2023 inspection May29–Jun8","2024 government response publication Sep26","CPT/Inf 2024 26 independent CPT authored inspection findings quoted inside response","CPT/Inf 2024 27 Estonia govt reply mixed with quotations, retrospective/policy changes","CPT/Inf(2024)27 is an official government response NOT authored inspection report, contains direct quoted CPT material 2023 and govt later data to April2024; code2024 only publication year. Official host mirror text47/47 pages identical while PDF binary475 bytes longer than repo original.","AUTHORED_SOURCE_TYPE_AND_DATE_PROVEN_BINARY_VARIANT_IDENTIFIED","CONFIRMED_AUTHORSHIP_PUBLICATION_VINTAGE_DIFFERENCE","Do not label document as separate audited CPT independent report nor assign all data to2024; never claim publisher PDF byte identity.","Use source authorship flag for every observation; confirm exact official CoE binary if site CDN becomes accessible."),
            ("MB-093","Estonia prison estate closed vs open visit capacity","CPT_2023_CLOSED_CAPACITY2921_VS_GOVT3041_UNALIGNED_120_SPACES_AND_OPEN_OCCUPANCY79_VS86","CPT visit May/Jun2023","Govt response prepared by Sept2024, exact date unspecified","PDF12 CPT at-visit capacity closed2921 open237 utilization61pct closed 79pct open","PDF12 govt answer 3041 closed 237 open and86pct open at answer preparation","+120 difference in closed prison places from two explicitly different source voices; government footnote legal max regulation, no exact matching 2023/2024 date in reply. Open79% at visit vs86% when response compiled, not same observation or headcount.","TIMING_AND_SOURCE_DEFINITION_UNRECONCILED_NO_NEW_BUILDING_EVIDENCE","CONFIRMED_NONCOMPARABLE_CPT_VS_GOVT_CAPACITY_AND_PCT","Do not mark120 newly created places nor infer exact separate regime census from rounded rates.","Locate legal capacity orders and observation timestamps if available."),
            ("MB-094","Estonia prison stock and incarceration rates","HISTORICAL_CLOSED_ONLY_2012_2017_VS_2023_TOTAL_POP_AND_2022_RATE","CPT historical2012/2017 closed custody","CPT2023 visit total custody1854 vs2022 rate162","PDF12 CPT2012 3389 CLOSED and 2017 2455 CLOSED prison counts","PDF12 CPT2023 total1854, national incarceration rates2012=250,2017=210,2022=162 per100k","Different prison universes named for historical counts, later national count at visit not annual mean; rate2022 not 2023 and no rate2024 in source.","NOT_HARMONIZED_SAME_STATISTICAL_UNIVERSE_AND_DATES","CONFIRMED_SCOPE_AND_TIME_UNALIGNED","Do not estimate annual prisoner growth or 2024 national population from 1854 or 162 rate.","Obtain consistent annual Estonia official national and open/closed definitions."),
            ("MB-095","Estonia officer versus healthcare FTE and staff post differences","2023_HEALTH_STAFF_CPT_FTE_VS_2024_OFFICER_GOVT_FTE_AND_AUTHORIZED_POSTS","2023 May/Jun site healthcare FTE","2024-04-18 prison officer FTE and posts","PDF20 CPT healthcare personnel Tallinn21.9/37.3 Tartu31.3/37 Viru22.1/34.5","PDF26 govt 2024-04-18 guards Tallinn270/322 Viru240/273 Tartu199/226","Prison OFFICERS filled FTE709 and posts821 as April18 2024 are different occupational category/time from CPT 2023 medical FTE75.3 and theoretical108.8; source reported 2023 officer vacancies about30pct not same data/time as observed 2024 posts.","PERSONNEL_ROLE_AND_DATE_DIFF_PROVEN","CONFIRMED_STAFF_UNIVERSE_AND_TIME_GRAIN_BREAK","Never add 2023 medical personnel as prison guard FTE or treat position vacancies as independent observed annual staff count.","Build exact year/place/occupation staff panel separately; no dynamic elasticity without matched prisoner site annual means."),
            ("MB-096","Estonia prison healthcare service financing responsibility","PRISON_HEALTH_SERVICE_FINANCE_MOVED_TOWARD_NATIONAL_HEALTH_SYSTEM_2024_JULY","Before 2024 prison/Justice health services","Government described planned 2024-07-01 switch","PDF20 govt prison medical services and care under Justice prison budget","PDF20 govt prospective 1July2024 Ministry of Social Affairs Health Insurance Fund regional provider financing","An announced / legislated migration of hospital and staff service funding from prison administration to mainstream health system changes cost and headcount per-prison accounting perimeter even if operational care persists. This document does not prove all flows executed on time or monetary magnitude.","REPORTS_INSTITUTIONAL_FINANCING_REFORM;EX_POST_EXECUTION_AND_SIZE_UNVERIFIED","CONFIRMED_INSTITUTIONAL_PERIMETER_CHANGE_RISK_IMPLEMENTATION_UNTESTED","Do not infer observed prison cost reduction / staffing elasticity from accounting boundary shift; do not invent spend.","Check official later agency financial statements and payer actual outturn before time series comparison."),
            ("MB-097","Estonia prison incident and other detention population universes","INCIDENT_COMPOSITES_COMPLAINTS_SUICIDES_AND_NONPRISON_BEDS_NOT_SAME_POPULATION","2021/2022 prison suicide and complaint counts","2023 broad assault or threats events and psychiatric populations","PDF p36 govt 2023 136/218/128 physical assaults OR imminent threat broad event mix","PDF p25 CPT prison suicide2021=5 2022=3; PDF p3 NPM complaints2022=344; p36 psychiatric patients/beds","482 broad 2023 events not unique staff attacks or unique inmates; 344 NPM complaints not proven offences; 2021-22 suicides events; psychiatric and migration detention beds/patients outside prison estate.","SOURCE_EVENT_SCOPE_AND_UNIVERSE_DIFFERENT","CONFIRMED_CROSS_DOMAIN_AND_EVENT_COUNT_NONCOMPARABILITY","Do not add psychiatric patients or migrant detention population to prisoners; no misconduct incidence rates without true denominators.","Preserve complaint versus assault/threat versus suicide definitions and exact years.")
          ]
          mfields=list(mb[0])
          for ident,geo,kind,earlier,later,cella,cellb,detail,cause,triage,avoid,nxt in problems:
            item=dict.fromkeys(mfields,"")
            item.update({"break_id":ident,"geography_and_scope":geo,"issue_type":kind,
            "earlier_period":earlier,"later_period":later,
            "original_source_a":source,"git_sha_a":sha,"original_cell_a":cella,
            "original_source_b":source,"git_sha_b":sha,"original_cell_b":cellb,
            "exact_observation":detail,"existing_evidence_artifact":sourcebr,
            "causal_explanation_status":cause,"triage_status":triage,
            "must_not_do":avoid,"resumption_or_next_check":nxt})
            mb.append(item)
          assert len(mb)==97 and mb[-1]["break_id"]=="MB-097"
          assert len({r["record_id"] for r in reg})==1574
          def dump(rows):
            out=io.StringIO(newline="")
            w=csv.DictWriter(out,fieldnames=list(rows[0]),quoting=csv.QUOTE_ALL,lineterminator="\n",extrasaction="raise")
            w.writeheader();w.writerows(rows);return out.getvalue().encode()
          qa={"task":"INT-019","source_original_git_sha1":sha,"source_sha256":sha256,"original_pages":47,
          "verified_mirror_byte_equality":False,"verified_mirror_text_page_matches":47,
          "numeric_source_observations":32,"other_source_institutional_event":1,
          "old_registry":1540,"new_registry":len(reg),"added_registry_objects":34,
          "old_methodology_issues":91,"new_methodology_issues":len(mb),
          "added_breaks":[x[0] for x in problems],
          "cross_cell_arithmetic_checks":[{"name":n,"computed":v,"expected":e,"pass":True} for n,v,e in expected]}
          files={prefix+"INDICATOR_PERIOD_COVERAGE_REGISTRY_v32.csv":dump(reg),
            prefix+"METHODOLOGICAL_BREAKS_AND_ANOMALIES_v34.csv":dump(mb),
            prog+"INT-019_catalog_integration_QA_v1.json":json.dumps(qa,ensure_ascii=False,indent=2).encode()}
          for path,payload in files.items():
            body=json.dumps({"message":"INT019 vetted source registry "+path.rsplit("/",1)[-1],"branch":"main","content":base64.b64encode(payload).decode()}).encode()
            req=urllib.request.Request("https://api.github.com/repos/"+repo+"/contents/"+path,data=body,method="PUT",headers={**h,"Content-Type":"application/json"})
            with urllib.request.urlopen(req,timeout=125) as r:print("SAVED",path,len(payload),r.status,flush=True)
          print("SUCCESS",len(reg),len(mb),flush=True)
          PY
