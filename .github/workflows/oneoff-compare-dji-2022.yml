name: One-off DJI publisher binary comparison
on:
  push:
    paths:
      - .github/workflows/oneoff-compare-dji-2022.yml
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare DOI pub bytes with archived exact binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,os,hashlib,json,base64
          old='https://raw.githubusercontent.com/'+os.environ['GH_REPOSITORY']+'/main/space-archive/extra/stp8/Netherlands_DJI_capaciteit_bezetting_sep-dec_2022.pdf'
          official='https://www.dji.nl/site/binaries/site-content/collections/documents/2023/01/10/capaciteit-en-bezetting-september-t-m-december-2022/Capaciteit%2Ben%2Bbezetting%2Bseptember%2Bt-m%2Bdecember%2B2022.pdf'
          def get(u):
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (compatible; academic archive integrity)'})
            with urllib.request.urlopen(req,timeout=90) as x:return x.read()
          arc=get(old)
          assert len(arc)==724073
          origin=get(official)
          a,b=hashlib.sha256(arc).hexdigest(),hashlib.sha256(origin).hexdigest()
          print('Archive PDF',len(arc),a)
          print('DJI official PDF',len(origin),b)
          same=arc==origin
          print('byte_equal',same)
          doc='Archive original Git SHA db2f73de005d37842c06290a0d27b8a83aa8e6cc\nArchive size '+str(len(arc))+' SHA256 '+a+'\nPublisher URL '+official+'\nPublisher size '+str(len(origin))+' SHA256 '+b+'\nBYTE_IDENTICAL '+str(same)+'\n'
          path='prison-research-archive/00_catalog/progress/INT-004_DJI_2022_official_binary_match_v1.txt'
          payload=json.dumps({'message':'catalog: compare exact 2022 DJI original publisher/archive SHA256','branch':'main','content':base64.b64encode(doc.encode()).decode()}).encode()
          url='https://api.github.com/repos/'+os.environ['GH_REPOSITORY']+'/contents/'+path
          req=urllib.request.Request(url,data=payload,method='PUT',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=45) as r: print('saved',r.status)
          PY
