name: One-off INT-010 official PDF SHA page/table extraction
on:
  push:
    paths:
      - .github/workflows/oneoff-int010-pdf.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify archived PDF against public agency and extract all pages with Poppler
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,sys,subprocess,urllib.request,hashlib,json,base64,re,csv,io,tempfile
          repo=os.environ["GH_REPOSITORY"]
          src="space-archive/extra/stp8/Rikosseuraamusasiakkaat-30.4.2022.pdf"
          import time
          raw=None
          errors=[]
          urls=["https://api.github.com/repos/"+repo+"/git/blobs/4f2894be67c053d40b32355e322aaef3cef3151f",
                "https://raw.githubusercontent.com/"+repo+"/main/"+src]
          for url in urls:
           for retry in range(4):
            try:
             h={"User-Agent":"Mozilla/5.0 source archive verified","Authorization":"Bearer "+os.environ["GH_TOKEN"]} if "api.github.com" in url else {"User-Agent":"Mozilla/5.0"}
             with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=90) as r:b=r.read()
             raw=base64.b64decode(json.loads(b)["content"]) if "/git/blobs/" in url else b
             if len(raw)==1714173:break
             errors.append("Size unexpected "+str(len(raw)))
             raw=None
            except Exception as exc:errors.append(type(exc).__name__+":"+str(exc)[:80]);time.sleep(1+retry)
           if raw is not None:break
          if raw is None:raise RuntimeError("Could not fetch source after retried public and authorized API paths: "+repr(errors))
          sha=hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
          assert(len(raw),sha)==(1714173,"4f2894be67c053d40b32355e322aaef3cef3151f")
          current="https://www.rikosseuraamus.fi/app/uploads/sites/11/2024/11/Rikosseuraamusasiakkaat-30.4.2022.pdf"
          legacy="https://www.rikosseuraamus.fi/material/collections/20220614100448/7a0YIpyOn/Rikosseuraamusasiakkaat_30042022.pdf"
          info={"source":src,"size":len(raw),"git_sha1":sha,"sha256":hashlib.sha256(raw).hexdigest(),"publisher":[]}
          for label,url in [("current_rise_site",current),("older_rise_site",legacy)]:
           try:
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(req,timeout=35) as r:
             b=r.read()
             info["publisher"].append({"label":label,"url":url,"status":r.status,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest(),"byte_identical":b==raw,"mime":r.headers.get("Content-Type"),"tls":"PYTHON_DEFAULT_VERIFIED"})
           except Exception as e:
            info["publisher"].append({"label":label,"url":url,"error":type(e).__name__+":"+str(e)[:200],"identical":"NOT_TESTED"})
          with tempfile.TemporaryDirectory() as td:
           p=td+"/source.pdf";open(p,"wb").write(raw)
           target=td+"/pypdf_packages"
          subprocess.run([sys.executable,"-m","pip","install","--quiet","--target",target,"pypdf"],check=True,timeout=110)
          sys.path.insert(0,target)
          from pypdf import PdfReader
          reader=PdfReader(io.BytesIO(raw))
          page_text=[page.extract_text(extraction_mode="layout") or "" for page in reader.pages]
          info["extraction_engine"]="pypdf pure Python explicit isolated target install"
          info["extracted_pages"]=len(page_text)
          info["all_chars"]=sum(len(t) for t in page_text)
          info["page_char_counts"]=[len(t) for t in page_text]
          info["pdfinfo"]={"metadata":{str(k):str(v) for k,v in (reader.metadata or {}).items()},"is_encrypted":reader.is_encrypted}
          assert len(page_text)==62,len(page_text)
          titles=[]
           for i,page in enumerate(page_text,1):
            for l in page.splitlines():
             z=l.strip()
             if re.search(r"^Taulukko\s+[1-5]-\d+",z):titles.append([i,z])
           source_table_lines=[]
           for i in [8,33,34,35]:
            for j,line in enumerate(page_text[i-1].splitlines(),1):
             if line.strip():source_table_lines.append([i,j,line.rstrip()])
           info["table_headings_found"]=len(titles)
           def cb(rows):
            o=io.StringIO(newline="");c=csv.writer(o,lineterminator="\n");c.writerows(rows);return o.getvalue().encode("utf-8")
           outputs={
           "INT-010_original_PDF_integrity_publisher_v1.json":json.dumps(info,ensure_ascii=False,indent=2).encode(),
           "INT-010_original_all_table_and_section_heading_index_v1.csv":cb([["pdf_page","table_caption_source"],*titles]),
           "INT-010_original_occupancy_source_lines_v1.csv":cb([["pdf_page","layout_text_line","original_line"],*source_table_lines]),
           }
           for first,last in [(1,20),(21,40),(41,62)]:
            txt="".join(f"## PDF page {k}\n"+page_text[k-1]+"\n" for k in range(first,last+1))
            outputs[f"INT-010_original_pdf_page_text_{first:02}_{last:02}_v1.txt"]=txt.encode()
           prefix="prison-research-archive/00_catalog/progress/"
           for name,data in outputs.items():
            assert len(data)<750000,(name,len(data))
            req=urllib.request.Request("https://api.github.com/repos/"+repo+"/contents/"+prefix+name,method="PUT",data=json.dumps({"message":"forensic: INT-010 verified PDF pages and source tables "+name,"content":base64.b64encode(data).decode(),"branch":"main"}).encode(),headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json"})
            with urllib.request.urlopen(req,timeout=60) as r:print("SAVED",name,len(data),r.status)
           print("FINISHED",len(page_text),"pages",len(titles),"captions",len(source_table_lines),"key lines")
          PY
