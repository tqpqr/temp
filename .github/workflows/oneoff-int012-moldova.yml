name: One-off INT-012 ministry prison capacity draft PDF forensic inspection
on:
  push:
    paths:
      - .github/workflows/oneoff-int012-moldova.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify archive SHA, government publisher and extract full proposed capacities
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,sys,subprocess,urllib.request,hashlib,json,base64,io,csv,re
          repo=os.environ["GH_REPOSITORY"]
          src="space-archive/extra/stp8/Moldova_Proiect_OMJ_capacitate_cazare_penitenciare.pdf"
          sha="03b800dd292d0ab7d3ed3c1ac40111f00c1c7971"
          url="https://api.github.com/repos/"+repo+"/git/blobs/"+sha
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"User-Agent":"ForensicArchiveAudit"}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=90) as f:b=json.load(f)
          raw=base64.b64decode(b["content"])
          blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
          assert (len(raw),blob)==(180794,sha),(len(raw),blob)
          temp="/tmp/forensic_int012_pypdf"
          subprocess.run([sys.executable,"-m","pip","install","--quiet","--target",temp,"pypdf"],check=True,timeout=90)
          sys.path.insert(0,temp)
          from pypdf import PdfReader
          pdf=PdfReader(io.BytesIO(raw))
          pages=[p.extract_text(extraction_mode="layout") or "" for p in pdf.pages]
          assert len(pages)>=4
          official="https://www.justice.gov.md/sites/default/files/document/attachments/1proiect_omj_sectoarele_de_detentie_si_capacitatea_de_cazare_in_institutii_penitenciare.pdf"
          gov={}
          try:
           req=urllib.request.Request(official,headers={"User-Agent":"Mozilla/5.0"})
           with urllib.request.urlopen(req,timeout=60) as r:
            actual=r.read()
            gov={"url":official,"http_status":r.status,"official_size":len(actual),"official_sha256":hashlib.sha256(actual).hexdigest(),"byte_identical":actual==raw,"tls_certificate_verification":"PYTHON_DEFAULT_VERIFIED"}
          except Exception as e:gov={"url":official,"error":type(e).__name__+":"+str(e)[:450],"status":"NOT_VERIFIED"}
          # Institution numerics extracted with original legal clause anchors.
          text="\n".join(pages)
          pattern=r'(?m)(\d{1,2})\)\s*Penitenciarul\s+nr\.\s*(\d+)\s*[–-]\s*([^\n]+)'
          found=list(re.finditer(pattern,text))
          rows=[]
          for index,match in enumerate(found):
           start,end=match.start(),(found[index+1].start() if index+1<len(found) else text.find("\n2. Administrația",match.end()))
           if end==-1:end=len(text)
           block=text[start:end]
           amounts=[int(t) for t in re.findall(r'Capacitatea\s+(?:totală\s+a\s+)?penitenciarului\s+constituie\s+([\d\s]+)\s+de\s+locuri',block,re.I)]
           pageno=next((i+1 for i,p in enumerate(pages) if "Penitenciarul nr. "+match.group(2) in p or "Penitenciarul nr."+match.group(2) in p),None)
           rows.append({"item":int(match.group(1)),"prison_no":int(match.group(2)),"name_and_type":match.group(3).strip(),"number_of_capacity_clauses":len(amounts),"capacity":amounts[0] if len(amounts)==1 else None,"original_phrase":match.group(0),"pdf_page_guess":pageno,"section_full":block[:2000]})
          info={"source_path":src,"source_bytes":len(raw),"sha1_git_blob":blob,"sha256":hashlib.sha256(raw).hexdigest(),"page_count":len(pages),"page_text_lengths":[len(t) for t in pages],"pdf_metadata":{str(k):str(v) for k,v in (pdf.metadata or {}).items()},"official_publisher":gov,"parsed_institution_clauses":rows,"unique_institution_numbers":len(set(x["prison_no"] for x in rows)),"document_is_draft":pages[0].strip().startswith("Proiect") or "Proiect" in pages[0][:100],"source_text_extraction":"pypdf layout, no OCR"}
          def cv(rows):
           s=io.StringIO(newline="");writer=csv.writer(s,lineterminator="\n");writer.writerows(rows);return s.getvalue().encode("utf-8")
          csvrows=[["project_clause_number","prison_number","name_and_type_original","proposed_capacity_places","source_pdf_page_guess","original_clause","source_status"],*[[r["item"],r["prison_no"],r["name_and_type"],r["capacity"],r["pdf_page_guess"],r["original_phrase"],"DRAFT_ONLY_NOT_ENACTED_BY_THIS_FILE"] for r in rows]]
          out={
          "prison-research-archive/00_catalog/progress/INT-012_original_draft_PDF_issuer_integrity_v1.json":json.dumps(info,ensure_ascii=False,indent=2).encode(),
          "prison-research-archive/00_catalog/progress/INT-012_original_draft_PDF_complete_page_text_v1.md":("\n\n".join("## Original source PDF page "+str(i+1)+"\n\n"+t for i,t in enumerate(pages))).encode(),
          "prison-research-archive/00_catalog/progress/INT-012_original_draft_institution_capacity_machine_extract_v1.csv":cv(csvrows)
          }
          for path,body in out.items():
           req=urllib.request.Request("https://api.github.com/repos/"+repo+"/contents/"+path,data=json.dumps({"message":"forensic: INT-012 SHA-verified ministry prison capacity draft source "+path.split("/")[-1],"content":base64.b64encode(body).decode(),"branch":"main"}).encode(),method="PUT",headers={**headers,"Content-Type":"application/json"})
           with urllib.request.urlopen(req,timeout=70) as r:print("SAVED",path,len(body),r.status)
          print("COMPLETE",len(pages),"pages",len(rows),"prison sections","official_identity",gov.get("byte_identical"),"capacities",[(r["prison_no"],r["capacity"]) for r in rows])
          PY
