name: Oneoff INT014 Poland 2022 source PDF forensic
on:
  push:
    paths:
      - .github/workflows/oneoff-int014-poland.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Verify Git original source and extract pages
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,urllib.request,json,base64,hashlib,subprocess,sys,io
          repo=os.environ["GH_REPOSITORY"];sha="0c442379401114ccdfd539f8cade0e85fba68584"
          h={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"User-Agent":"Archive-Audit"}
          req=urllib.request.Request("https://api.github.com/repos/"+repo+"/git/blobs/"+sha,headers=h)
          with urllib.request.urlopen(req,timeout=150) as r: data=json.load(r)
          b=base64.b64decode(data["content"])
          assert len(b)==4290431 and hashlib.sha1(b"blob "+str(len(b)).encode()+bytes([0])+b).hexdigest()==sha
          subprocess.check_call([sys.executable,"-m","pip","install","--quiet","--target","/tmp/pypdfint014","pypdf"])
          sys.path.insert(0,"/tmp/pypdfint014")
          from pypdf import PdfReader
          pdf=PdfReader(io.BytesIO(b))
          pages=[p.extract_text(extraction_mode="layout") or "" for p in pdf.pages]
          info={"source_bytes":len(b),"git_sha1":sha,"sha256":hashlib.sha256(b).hexdigest(),"pages":len(pages),"metadata":{str(k):str(v) for k,v in (pdf.metadata or {}).items()},"page_lengths":[len(x) for x in pages],"issuer_listing":"https://sw.gov.pl/strona/statystyka-roczna"}
          files={"INT-014_PDF_source_integrity_v1.json":json.dumps(info,ensure_ascii=False,indent=2).encode()}
          for k in range(0,len(pages),15):
           end=min(len(pages),k+15)
           files["INT-014_original_pdf_page_text_%03d_%03d_v1.md"%(k+1,end)]="\n\n".join("## PDF page %d\n\n%s"%(i+1,pages[i]) for i in range(k,end)).encode()
          for name,raw in files.items():
           import base64
           payload=json.dumps({"message":"forensic INT014 source pages "+name,"content":base64.b64encode(raw).decode(),"branch":"main"}).encode()
           r=urllib.request.Request("https://api.github.com/repos/"+repo+"/contents/prison-research-archive/00_catalog/progress/"+name,data=payload,method="PUT",headers={**h,"Content-Type":"application/json"})
           with urllib.request.urlopen(r,timeout=105) as response:print("SAVED",name,len(raw),response.status,flush=True)
          print("DONE",len(pages),sum(map(len,pages)),flush=True)
          PY
