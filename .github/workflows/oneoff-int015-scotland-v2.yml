name: Oneoff INT015 Scotland PDF provenance v2
on:
  push:
    paths:
      - .github/workflows/oneoff-int015-scotland-v2.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Verify original blob, compare publisher, extract text
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, io, sys, json, hashlib, base64, urllib.request, subprocess
          from datetime import datetime, timezone
          repo=os.environ["GH_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          sha="7e993349b17c6ec0f177862134091092ea86f18e"
          expected_size=1107330
          publisher="https://www.audit-scotland.gov.uk/uploads/docs/report/2023/s22_231212_scottish_prison_service.pdf"
          headers={"Authorization":"Bearer "+token, "User-Agent":"ResearchArchiveVerifier/INT015"}
          blob_url="https://api.github.com/repos/"+repo+"/git/blobs/"+sha
          with urllib.request.urlopen(urllib.request.Request(blob_url,headers=headers),timeout=150) as response:
              blob=json.load(response)
          raw=base64.b64decode(blob["content"])
          assert len(raw)==expected_size, ("size mismatch",len(raw),expected_size)
          git_hash=hashlib.sha1(b"blob "+str(len(raw)).encode("ascii")+bytes([0])+raw).hexdigest()
          assert git_hash==sha, ("Git SHA1 mismatch",git_hash,sha)
          report={"original_path":"space-archive/extra/stp8/Scotland_AuditScotland_SPS_2022-23_s22.pdf","original_bytes":len(raw),"git_blob_sha1":git_hash,"original_sha256":hashlib.sha256(raw).hexdigest(),"publisher_url":publisher,"run_utc":datetime.now(timezone.utc).isoformat(),"publisher_comparison":{}}
          print("ORIGINAL VERIFIED",len(raw),git_hash,report["original_sha256"],flush=True)
          try:
              req=urllib.request.Request(publisher,headers={"User-Agent":"Mozilla/5.0 (academic source archive verification)"})
              with urllib.request.urlopen(req,timeout=100) as response:
                  official=response.read()
                  report["publisher_comparison"]={"http_status":response.status,"resolved_url":response.url,"tls_verified":True,"bytes":len(official),"sha256":hashlib.sha256(official).hexdigest(),"byte_identical":raw==official}
          except Exception as error:
              report["publisher_comparison"]={"error":type(error).__name__+": "+str(error)[:350],"byte_identical":None}
          subprocess.check_call([sys.executable,"-m","pip","install","--quiet","--target","/tmp/pypdf-int015-v2","pypdf"])
          sys.path.insert(0,"/tmp/pypdf-int015-v2")
          from pypdf import PdfReader
          reader=PdfReader(io.BytesIO(raw))
          pages=[p.extract_text(extraction_mode="layout") or "" for p in reader.pages]
          report["original_pdf_page_count"]=len(pages)
          report["metadata"]={str(key):str(val) for key,val in (reader.metadata or {}).items()}
          report["page_text_lengths"]=[len(p) for p in pages]
          uploads={"INT-015_original_PDF_integrity_v2.json":json.dumps(report,indent=2,ensure_ascii=False).encode()}
          for pos in range(0,len(pages),7):
              end=min(len(pages),pos+7)
              name="INT-015_original_pdf_page_text_%03d_%03d_v2.md"%(pos+1,end)
              text="\n\n".join("## Physical PDF page %d\n\n%s"%(i+1,pages[i]) for i in range(pos,end))
              uploads[name]=text.encode("utf-8")
          for name,raw_file in uploads.items():
              path="prison-research-archive/00_catalog/progress/"+name
              body=json.dumps({"message":"INT015 forensic: "+name,"branch":"main","content":base64.b64encode(raw_file).decode("ascii")}).encode()
              req=urllib.request.Request("https://api.github.com/repos/"+repo+"/contents/"+path,method="PUT",data=body,headers={**headers,"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=105) as response:
                  print("UPLOADED",name,len(raw_file),response.status,flush=True)
          print("FINAL",json.dumps({"page_count":len(pages),"publisher_check":report["publisher_comparison"]}),flush=True)
          PY
