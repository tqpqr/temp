name: Oneoff INT016 archived SPS report integrity and page extraction
on:
  push:
    paths:
      - .github/workflows/oneoff-int016-source-v1.yml
permissions:
  contents: write
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Verify exact archived PDF, independent issuer SHA, and extract all pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,sys,json,hashlib,base64,io,urllib.request,subprocess
          from datetime import datetime,timezone
          repo=os.environ["GH_REPOSITORY"]; token=os.environ["GH_TOKEN"]
          source="space-archive/extra/stp8/Scotland_SPS_Annual_Report_2022-23.pdf"
          sha="ec737ad980939b3f9cb385e54e9548b6417f7cb5"
          size=2886914
          official="https://www.sps.gov.uk/sites/default/files/2024-02/AnnualReportAndAccounts_2022-2023_CorporateReports.pdf"
          h={"Authorization":"Bearer "+token,"User-Agent":"Archive-INT016-verifier"}
          def jsonget(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=150) as r:return json.load(r)
          obj=jsonget("https://api.github.com/repos/"+repo+"/git/blobs/"+sha)
          raw=base64.b64decode(obj["content"])
          assert len(raw)==size,("wrong source size",len(raw))
          assert hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()==sha,"original Git hash wrong"
          report={"original_path":source,"original_git_sha1":sha,"original_bytes":len(raw),"original_sha256":hashlib.sha256(raw).hexdigest(),"original_pdf_header":raw[:8].decode("latin1"),"run_at_utc":datetime.now(timezone.utc).isoformat(),"issuer_url":official}
          print("ARCHIVE VERIFIED",len(raw),report["original_sha256"],flush=True)
          try:
            req=urllib.request.Request(official,headers={"User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(req,timeout=120) as resp:
              official_data=resp.read()
              report["official_comparison"]={"tls_validated":True,"http_status":resp.status,"final_url":resp.url,"official_bytes":len(official_data),"official_sha256":hashlib.sha256(official_data).hexdigest(),"exact_byte_identical":raw==official_data}
          except Exception as e:
            report["official_comparison"]={"exact_byte_identical":None,"error":type(e).__name__+": "+str(e)[:350]}
          subprocess.check_call([sys.executable,"-m","pip","install","--quiet","--target","/tmp/int016pypdf","pypdf"])
          sys.path.insert(0,"/tmp/int016pypdf")
          from pypdf import PdfReader
          pdf=PdfReader(io.BytesIO(raw))
          pages=[page.extract_text(extraction_mode="layout") or "" for page in pdf.pages]
          report["physical_pdf_pages"]=len(pages)
          report["pdf_metadata"]={str(k):str(v) for k,v in (pdf.metadata or {}).items()}
          report["page_text_lengths"]=[len(v) for v in pages]
          report["very_low_text_pages"]=[i+1 for i,v in enumerate(pages) if len(v)<180]
          report["pages_with_images"]=[i+1 for i,p in enumerate(pdf.pages) if len(p.images)>0]
          prefix="prison-research-archive/00_catalog/progress/"
          files={"INT-016_original_PDF_integrity_v1.json":json.dumps(report,indent=2,ensure_ascii=False).encode()}
          for start in range(0,len(pages),16):
            end=min(len(pages),start+16)
            name="INT-016_original_pdf_page_text_%03d_%03d_v1.md"%(start+1,end)
            files[name]="\n\n".join("## PDF physical page %d\n\n%s"%(i+1,pages[i]) for i in range(start,end)).encode("utf-8")
          # Counts, not content, of evidence across physical source pages
          import re,csv
          headings=[]
          for i,page in enumerate(pages):
            for m in re.finditer(r"(?im)^\s*(?:statement of|notes? to|performance|prison population|our resources|staff report|financial|appendix\s+\d+|operating costs|average prison population)[^\n]{0,100}",page):
              headings.append({"page":i+1,"source_snippet":m.group(0).strip()})
          buf=io.StringIO()
          w=csv.DictWriter(buf,fieldnames=["page","source_snippet"]);w.writeheader();w.writerows(headings)
          files["INT-016_original_page_heading_index_v1.csv"]=buf.getvalue().encode()
          for name,payload in files.items():
            path=prefix+name
            body=json.dumps({"message":"forensic INT016 original PDF "+name,"content":base64.b64encode(payload).decode(),"branch":"main"}).encode()
            req=urllib.request.Request("https://api.github.com/repos/"+repo+"/contents/"+path,headers={**h,"Content-Type":"application/json"},data=body,method="PUT")
            with urllib.request.urlopen(req,timeout=120) as r:print("SAVED",name,len(payload),r.status,flush=True)
          print("SUCCESS",json.dumps({"pages":len(pages),"SHA256":report["original_sha256"],"issuer":report["official_comparison"],"chunks":len(files)}),flush=True)
          PY
