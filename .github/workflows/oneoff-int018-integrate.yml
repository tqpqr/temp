name: Oneoff INT018 Slovenia catalog integration
on:
  push:
    paths:
      - .github/workflows/oneoff-int018-integrate.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Independently reconcile issuer table evidence and append registries
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,io,csv,base64,json,urllib.request
          from decimal import Decimal,ROUND_HALF_UP
          repo=os.environ["GH_REPOSITORY"]
          tok=os.environ["GH_TOKEN"]
          h={"Authorization":"Bearer "+tok,"User-Agent":"INT018-Catalog-SourceQA"}
          base="prison-research-archive/00_catalog/"
          pp=base+"progress/"
          sha="7314a56154bca5771f965a1fae88a2c9ba9a60a5"
          sha256="44b69b045f9f9ff6497e80ba474eb5fae012be48bf0cb9654dede085e41c120b"
          source="space-archive/extra/stp8/Slovenia_URSIKS_Letno_porocilo_2022.pdf"
          publisher="https://www.gov.si/assets/organi-v-sestavi/URSIKS/Dokumenti/Letna-porocila-/Letno-porocilo-2022.pdf"
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=155) as r: return json.load(r)
          def getfile(path):
            return base64.b64decode(get("https://api.github.com/repos/"+repo+"/contents/"+path)["content"]).decode("utf-8-sig")
          def getblob(blob):
            return base64.b64decode(get("https://api.github.com/repos/"+repo+"/git/blobs/"+blob)["content"]).decode("utf-8-sig")
          def parse(text):return list(csv.DictReader(io.StringIO(text)))
          reg=parse(getblob("6d3fbae90164665d49b554dff69521fd9ee59fc5"))
          mb=parse(getblob("707b31d12153020acf4648a0352ee45d10bb5a1c"))
          assert len(reg)==1519 and reg[-1]["record_id"]=="R01519"
          assert len(mb)==87 and mb[-1]["break_id"]=="MB-087"
          orig=json.loads(getfile(pp+"INT-018_original_PDF_integrity_v1.json"))
          assert orig["original_git_blob_sha1"]==sha and orig["original_sha256"]==sha256 and orig["original_bytes"]==3187810 and orig["physical_page_count"]==128
          assert orig["publisher_comparison"]["tls_verified"] is True and orig["publisher_comparison"]["byte_identical"] is True
          sites=parse(getfile(pp+"INT-018_14_facility_capacity_annual_population_2022_v1.csv"))
          funds=parse(getfile(pp+"INT-018_2022_spending_5_economic_6_funding_9_budgetlines_v1.csv"))
          historic=parse(getfile(pp+"INT-018_2014_2022_national_mean_prisoners_cost_day_v1.csv"))
          staff=parse(getfile(pp+"INT-018_source_staff_roles_2022_v1.csv"))
          assert [len(sites),len(funds),len(historic),len(staff)]==[14,20,9,11]
          dec=lambda s:Decimal(str(s))
          tests=[]
          def check(name,value,expected,tolerance="0"):
            ok=abs(dec(value)-dec(expected))<=dec(tolerance)
            tests.append({"test":name,"computed":str(value),"expected":str(expected),"pass":ok})
            if not ok:raise ValueError(("QA",name,value,expected))
          places=sum(int(x["normative_places_reported_2022"]) for x in sites)
          mean=sum(dec(x["annual_mean_persons_reported_2022"]) for x in sites)
          check("sum_14_normative_places",places,1345)
          check("sum_14_annual_mean_persons",mean,"1402.1")
          for x in sites:
            rate=dec(x["annual_mean_persons_reported_2022"])/dec(x["normative_places_reported_2022"])*100
            shown=rate.quantize(Decimal("0.1"),rounding=ROUND_HALF_UP)
            check("reported_site_utilization_"+x["source_row"],shown,x["report_utilization_percent"])
          check("published_grand_utilization_from_BAD_1436_total",(dec("1436")/dec("1345")*100).quantize(Decimal("0.1"),rounding=ROUND_HALF_UP),"106.8")
          anomaly=dec("1436.0")-mean
          check("literal_table_discrepancy",anomaly,"33.9")
          group=lambda k:[r for r in funds if r["source_table"]==k]
          econ=group("source_table95_economic_code")
          funding=group("narrative_2022_funding")
          programme=group("source_table96_appropriation")
          assert [len(econ),len(funding),len(programme)]==[5,6,9]
          total=lambda rows:sum(dec(r["value_eur"]) for r in rows)
          check("all_sources_5_economic_codes",total(econ),"54718459.56")
          check("all_sources_6_funding_sources",total(funding),"54718459.56")
          check("budget_program_9_lines",total(programme),"54117805.36")
          check("other_funding_sources_total",total(funding)-dec("54117805.36"),"600654.20")
          check("budget_plus_other_to_all",dec("54117805.36")+dec("600654.20"),"54718459.56")
          check("budget_based_cost_per_person_day", (dec("54117805.36")/(dec(365)*dec(1402))).quantize(Decimal("1"),rounding=ROUND_HALF_UP),106)
          check("other_funds_cost_per_day_diff", (dec("54718459.56")/(dec(365)*dec(1402))).quantize(Decimal("1"),rounding=ROUND_HALF_UP),107)
          assert [int(x["calendar_year"]) for x in historic]==list(range(2014,2023))
          assert historic[-1]["prison_population_average_published_persons"]=="1402" and historic[-2]["prison_population_average_published_persons"]=="1284"
          assert historic[-1]["daily_custody_cost_reported_eur_per_prisoner"]=="106"
          check("national_mean_growth_2021_2022_percent",( (dec(1402)/dec(1284)-1)*100).quantize(Decimal("0.1"),rounding=ROUND_HALF_UP),"9.2")
          S={r["metric"]:int(r["value"]) for r in staff}
          check("all_staff_2022_management_plus_specialist",S["agency_management_employees"]+S["agency_specialized_employees"],926)
          check("authorized_uniformed_role_breakdown",sum(S[k] for k in ("authorized_basic","authorized_senior","authorized_inspector","authorized_senior_inspector")),572)
          assert S["agency_security_role_category"]==556 and S["authorized_uniformed_personnel"]==572
          fields=list(reg[0])
          basevals={"source_domain":"SI_URSIKS_ANNUAL_2022",
          "source_reference":"00_catalog/progress/INT-018_Slovenia_URSIKS_2022_verified_source_audit_v1.md;00_catalog/progress/INT-018_original_PDF_integrity_v1.json",
          "original_source_path":source,"original_git_blob_sha1":sha,
          "coverage_evidence":"ARCHIVED_GIT_ORIGINAL_128_PAGES_SHA256_ISSUER_TLS_BYTE_IDENTICAL_VISUAL_SELECTED_SOURCE_TABLES",
          "publication_vintage":"SLOVENIA_URSIKS_2022_COVER_JUNE2023_PDF_CREATED_JUL14_2023_PUBLISHER_JUL17_2023",
          "official_upstream_url":publisher,
          "external_binary_identity":"EXACT_TLS_VALIDATED_BYTE_IDENTICAL_SHA256_"+sha256,
          "field_coverage_status":"SELECTED_ORIGINAL_TABLES_VISUAL_VERIFIED_NOT_ALL_128_PAGES_NORMALIZED",
          "semantic_code_definition_status":"SOURCE_ROW_OR_ACCOUNTING_PERIMETER_WITH_EXPLICIT_LIMITS"}
          def add(**kwargs):
            row=dict.fromkeys(fields,"")
            row.update(basevals);row.update(kwargs)
            row["record_id"]="R%05d"%(1520+len(reg)-1519)
            reg.append(row)
          link="00_catalog/progress/INT-018_2014_2022_national_mean_prisoners_cost_day_v1.csv"
          for col,unit,code,lim,breaks in [
           ("prison_population_average_published_persons","persons_year_mean","annual_mean_custody_2014_2022","Annual averages; 2022 =1402 is correct national mean; separate printed site table total1436 is inconsistent","MB-088;MB-089"),
           ("daily_custody_cost_reported_eur_per_prisoner","EUR_per_person_day","budget_funded_care_day_cost_2014_2022","Rounded yearly published EUR daily cost; numerator budget appropriations, NOT all funding sources nor per available place","MB-090")]:
            pairs=";".join(r["calendar_year"]+"="+r[col] for r in historic)
            add(record_type="SOURCE_9_YEAR_NATIONAL_TIMESERIES",indicator_code="SI_URSIKS_"+code,
            indicator_name_original=code,indicator_unit=unit,territorial_level="Slovenia national custodial system",
            temporal_grain="CALENDAR_YEAR_ANNUAL_MEAN_OR_BUDGET_RATE",
            first_period_recorded="2014",last_period_recorded="2022",
            listed_periods_exact=";".join(str(y) for y in range(2014,2023)),distinct_nominal_years="9",
            reporting_window_type="CALENDAR_2014_2022_NOT_FY",
            numeric_evidence=pairs,source_reference=basevals["source_reference"]+";"+link,
            source_cell_anchor="PDF physical p119 printed p117 original source table97",
            important_limitations=lim,measurement_status="VERIFIED_ORIGINAL_SOURCE_TIME_SERIES",
            linked_break_ids=breaks,number_of_source_records="9")
          add(record_type="COMPLETE_14_SITE_SOURCE_MATRIX",indicator_code="SI_URSIKS_2022_site_normative_capacity_mean_population_14",
            indicator_name_original="Zasedenost posameznih zavodov in oddelkov glede na povprečno število zaprtih oseb",
            indicator_unit="places_and_annual_average_persons_and_percentage",
            territorial_level="Slovenia 14 reported institutions departments juvenile reeducation units",
            temporal_grain="2022_NORMATIVE_CAPACITY_REFERENCE_AND_2022_ANNUAL_MEAN",
            first_period_recorded="2022",last_period_recorded="2022",listed_periods_exact="2022",distinct_nominal_years="1",
            reporting_window_type="MIXED_NORMATIVE_CAPACITY_WITH_FULL_YEAR_PERSON_MEAN",
            numeric_evidence="14_SITE_NORMATIVE_PLACE_SUM=1345;14_MEANS_SUM=1402.1;PUBLISHER_TABLE_GRAND_TOTAL_WRONGLY_1436;PUBLISHER_RATE_WRONGLY_106.8",
            source_reference=basevals["source_reference"]+";00_catalog/progress/INT-018_14_facility_capacity_annual_population_2022_v1.csv",
            source_cell_anchor="PDF physical p120 printed p118 source table98",
            important_limitations="SOURCE INTERNAL TABLE TOTAL ERROR +33.9; correct national avg1402 elsewhere; 14 rows mix parent prison departments youth reeducation; not independent prisons",
            measurement_status="SOURCE_SITE_ROWS_VERIFIED_PRINTED_AGGREGATE_FAIL",
            linked_break_ids="MB-088;MB-089",
            source_facility_rows="14",number_of_numeric_facility_cells="42",
            original_publisher_total_value="CAPACITY_1345;ERRONEOUS_MEAN_1436.0;ERRONEOUS_RATE_106.8PCT",
            number_of_source_records="14")
          for groupname,n in [("source_table95_economic_code",5),("narrative_2022_funding",6),("source_table96_appropriation",9)]:
            links={"source_table95_economic_code":"MB-090","narrative_2022_funding":"MB-090","source_table96_appropriation":"MB-090"}[groupname]
            add(record_type="COMPLETE_ORIGINAL_BUDGET_BREAKDOWN_SOURCE_MATRIX",
              indicator_code="SI_URSIKS_2022_"+groupname,
              indicator_name_original=groupname,indicator_unit="EUR_calendar_2022",
              territorial_level="Slovenia URSIKS national expenditure source groups",
              temporal_grain="2022_CALENDAR_SPENDING",
              first_period_recorded="2022",last_period_recorded="2022",listed_periods_exact="2022",distinct_nominal_years="1",
              reporting_window_type="SOURCE_GROUP_ACCOUNTING_PERIMETER",
              numeric_evidence="SOURCE_ROWS="+str(n)+";SEE_SOURCE_CSV",
              source_reference=basevals["source_reference"]+";00_catalog/progress/INT-018_2022_spending_5_economic_6_funding_9_budgetlines_v1.csv",
              source_cell_anchor="PDF physical p118-119 source tables95 and96 and funding narrative",
              important_limitations="Budget subprogramme, all-source economic and source-of-funding views overlap; no sum across views",
              measurement_status="PUBLISHER_SOURCE_ACCOUNTING_MATRIX_RECONCILED",
              linked_break_ids=links,number_of_source_records=str(n))
          for label,value,where,limits in [
           ("all_sources_spending_EUR", "54718459.56","PDF p118 source Table95","Includes capital; not all budget-only"),
           ("state_budget_spending_EUR","54117805.36","PDF p119 budget program Table96","Subset of all sources and numerator used for 106/day")]:
            add(record_type="VERIFIED_EXACT_SOURCE_NATIONAL_SPENDING",
              indicator_code="SI_URSIKS_2022_"+label,
              indicator_name_original=label,indicator_unit="EUR",
              territorial_level="Slovenia URSIKS agency national",temporal_grain="2022_CALENDAR_EXPENSE",
              first_period_recorded="2022",last_period_recorded="2022",
              listed_periods_exact="2022",distinct_nominal_years="1",
              reporting_window_type="SOURCE_DEFINED_ACCOUNTING_PERIMETER",
              numeric_evidence=value,source_cell_anchor=where,
              important_limitations=limits,
              observed_value_raw=value,measurement_status="VERIFIED_PUBLISHER_SPENDING_VALUE",
              linked_break_ids="MB-090",number_of_source_records="1")
          for item in staff:
            add(record_type="YEAR_END_STAFF_OR_CALENDAR_PERSON_FLOW",
              indicator_code="SI_URSIKS_"+item["metric"]+"_"+item["period"].replace("-","_"),
              indicator_name_original=item["metric"],indicator_unit=item["unit"],
              territorial_level="Slovenia national URSIKS agency",
              temporal_grain="2022_12_31_POINT" if item["period"]=="2022-12-31" else "2022_CALENDAR_YEAR_FLOW",
              first_period_recorded=item["period"],last_period_recorded=item["period"],
              listed_periods_exact=item["period"],distinct_nominal_years="1",
              reporting_window_type="EXACT_DATE_STAFF_COUNT_OR_ANNUAL_STAFF_FLOW",
              numeric_evidence=item["value"],
              source_reference=basevals["source_reference"]+";00_catalog/progress/INT-018_source_staff_roles_2022_v1.csv",
              source_cell_anchor=item["source_anchor"],important_limitations=item["scope_note"],
              observed_value_raw=item["value"],measurement_status="SOURCE_HUMAN_RESOURCES_LITERAL_VALUE",
              linked_break_ids="MB-091",number_of_source_records="1")
          add(record_type="VERIFIED_SOURCE_NORMATIVE_CAPACITY_2022",
            indicator_code="SI_URSIKS_2022_total_normative_places",
            indicator_name_original="Zmogljivost zavodov in njihova zasedenost",indicator_unit="normative_places",
            territorial_level="Slovenia prisons departments and youth institution",temporal_grain="SOURCE_2022_NORMATIVE_CAPACITY_REFERENCE_NOT_EXACT_DAY",
            first_period_recorded="2022",last_period_recorded="2022",listed_periods_exact="2022",distinct_nominal_years="1",
            reporting_window_type="CAPACITY_SOURCE_POINT_IN_YEAR_UNSPECIFIED",
            numeric_evidence="1345",observed_value_raw="1345",source_cell_anchor="PDF physical p120 source table98",
            important_limitations="9m2 one-person vs7m2 shared-cell requirements; not year-average bed supply; up22 vs earlier year",
            measurement_status="VERIFIED_NORMATIVE_SOURCE_CAPACITY",linked_break_ids="MB-089",
            number_of_source_records="1")
          add(record_type="PUBLISHER_INTERNAL_ARITHMETIC_DISCREPANCY_DESCRIPTOR_NOT_OBSERVED_POPULATION",
            indicator_code="SI_URSIKS_2022_facility_annual_avg_ERRONEOUS_PUBLISHED_GRAND_TOTAL",
            indicator_name_original="SKUPAJ annual mean published 1436,0 although 14 lines sum1402,1",
            indicator_unit="source_error_descriptor_not_new_pop_count",
            territorial_level="Slovenia 14 facility source report",
            temporal_grain="2022_SOURCE_TABLE_ERROR",
            first_period_recorded="2022",last_period_recorded="2022",listed_periods_exact="2022",distinct_nominal_years="1",
            reporting_window_type="PUBLISHER_LITERAL_INVALID_GRAND_TOTAL",
            numeric_evidence="PRINTED_1436.0;ROW_SUM_1402.1;DIFFERENCE_33.9;PRINTED_UTILIZATION_106.8pct;ALIGNED_ROW_SUM_IMPLIED_104.2pct",
            source_cell_anchor="PDF physical p120 original table98 grand total vs all14 rows; p119 1402 in table97",
            important_limitations="PRINTED GRANT TOTAL WRONG do not introduce 1436 as Slovakia prison annual mean",
            measurement_status="CONFIRMED_SOURCE_INTERNAL_ARITHMETIC_ERROR_NOT_OBSERVED",
            linked_break_ids="MB-088",number_of_source_records="14")
          assert len(reg)==1540 and reg[-1]["record_id"]=="R01540",("register",len(reg),reg[-1]["record_id"])
          issues=[
          ("MB-088","Slovenia URSIKS p120 source table98 population","PUBLISHED_FACILITY_MEAN_GRAND_TOTAL_AND_OCCUPANCY_RATE_CONTRADICT_ALL_14_SOURCE_ROWS","2022 report same source 14 site rows","2022 report source table98 grand total","PDF physical p120 original 14 site/department means summed1402.1","PDF physical p120 publisher original SKUPAJ 1436.0 /106.8pct","14 published site source row means sum1402.1, national year-average elsewhere=1402; table total says1436.0, difference+33.9 beyond rounding; reported 106.8% = 1436/1345, while source rows imply104.2%.","SOURCE_INTERNAL_ARITHMETIC_CONTRADICTION_VERIFIED_CAUSE_UNKNOWN","CONFIRMED_PUBLISHER_GRAND_TOTAL_AND_RATE_ERROR","Do not use 1436 as 2022 national average or report 106.8pct as an independently reconciled ratio; do not alter original.","Compare prior/later annual editions for source erratum; no issuer correspondence."),
          ("MB-089","Slovenia URSIKS 2022 institutions / spatial capacity","NORMATIVE_9M2_7M2_CAPACITY_VS_CALENDAR_AVERAGE_OCCUPANTS_AND_MIXED_BRANCH_JUVENILE_ROWS","2022 site norm capacity1345","2022 year mean people1402","PDF p120 text normative solitary9sqm shared7sqm and 2022 spaces1345","PDF p120 14 site mean rows incl adult prison departments and PD Radece youth","Issuer normative beds based on space standard and 2022 mean prisoners refer to different measures/time grains; child departments and PD Radece not independent general adult prisons.","CAPACITY_STANDARD_CONFIRMED_SITE_HIERARCHY_SCOPE","CONFIRMED_DIFFERENT_UNITS_AND_TIME_GRAIN","Do not treat 14 source facility/department rows as 14 independent prisons or mix PD juveniles into adult ordinary prison elasticity denominator.","Establish parent-child units and reference-date/year bed denominator."),
          ("MB-090","Slovenia URSIKS fiscal 2022 expense budget boundaries","ALL_FUNDS_54718459_VS_STATE_BUDGET_54117805_INCLUDES_CAPITAL_AND_DAILY_CARE_RATE","2022 source Table95 economic breakdown","2022 source Table96 budget appropriations and custody per day cost","PDF p118 economic5 groups EUR54718459.56 including source420 capital EUR7748267.10","PDF p119 nine state-budget programme lines EUR54117805.36 used for 106eur/person/day","All-funding expense 54718459.56 = state-budget54117805.36 + five other sources600654.20; 106/person/day uses state-budget numerator /365 /1402, whereas full-source numerator would round107. Source matrices are overlapping views, not distinct expendables to add.","SOURCE_FINANCIAL_PERIMETERS_RECONCILED_EXACTLY","CONFIRMED_BUDGET_PERIMETER_AND_RATE_BASE","Do not double add capital, sum programme/economic/funding source views, or interpret 106 as full all-source or per bed daily cost.","Keep fiscal year 2022 nominal euro amounts; assess strictly comparable cost perimeter internationally."),
          ("MB-091","Slovenia URSIKS staffing and official role definitions","ENDYEAR_TOTAL_926_VS_SECURITY_ROLE_556_VS_AUTHORIZED_OFFICERS_572_AND_HIRING_FLOWS","2022-12-31 staff census","2022 staffing movements","PDF p112 Table91 agency 926 =65+861 and security staff category556","PDF p112 Table92 authorized persons572 incl 469+61+18+24; p113 58 hires and51 departures","Two role classification universes 556 and572 cannot be interchanged, all-agency staff926 is year-end not annual FTE, 58 joiners 51 leavers yearly flow not average staff.","PUBLISHER_DISTINCT_CLASSIFICATIONS_AND_TEMPORAL_GRAINS_VERIFIED","CONFIRMED_HUMAN_RESOURCE_SCOPE_DIFFERENCE","Do not treat 572 as 2022 averaged uniformed security FTE or 556 as same classification; do not infer annual average from flow net.","Find exact prison-by-role annual average if separately published.")
          ]
          mbfields=list(mb[0])
          for ident,geo,typ,earlier,later,cella,cellb,observation,causal,status,avoid,nxt in issues:
            row=dict.fromkeys(mbfields,"")
            row.update({"break_id":ident,"geography_and_scope":geo,"issue_type":typ,
            "earlier_period":earlier,"later_period":later,
            "original_source_a":source,"git_sha_a":sha,"original_cell_a":cella,
            "original_source_b":source,"git_sha_b":sha,"original_cell_b":cellb,
            "exact_observation":observation,
            "existing_evidence_artifact":"progress/INT-018_Slovenia_URSIKS_2022_verified_source_audit_v1.md;progress/INT-018_original_PDF_integrity_v1.json",
            "causal_explanation_status":causal,"triage_status":status,
            "must_not_do":avoid,"resumption_or_next_check":nxt})
            mb.append(row)
          assert len(mb)==91 and mb[-1]["break_id"]=="MB-091"
          qa={"task":"INT-018","original_sha256":sha256,"publisher_byte_identical":True,
           "original_PDF_pages":128,"new_indicator_count":len(reg),"old_indicator_count":1519,"added":21,
           "new_method_count":len(mb),"old_method_count":87,"added_MB":[i[0] for i in issues],
           "total_original_site_rows":14,"site_avg_source_sum":"1402.1","published_ERRONEOUS_total":"1436.0","bad_grand_total_difference":"33.9",
           "budget_full_sources":"54718459.56","budget_only":"54117805.36",
           "selected_table_coverage_only":True,"machine_text_glyph_remapping_warning":True,
           "tests_passed":len(tests),"tests":tests}
          def dump(rows):
            b=io.StringIO(newline="")
            writer=csv.DictWriter(b,fieldnames=list(rows[0]),quoting=csv.QUOTE_ALL,lineterminator="\n",extrasaction="raise")
            writer.writeheader();writer.writerows(rows)
            return b.getvalue().encode()
          outputs={
             base+"INDICATOR_PERIOD_COVERAGE_REGISTRY_v31.csv":dump(reg),
             base+"METHODOLOGICAL_BREAKS_AND_ANOMALIES_v33.csv":dump(mb),
             pp+"INT-018_source_numeric_reconciliation_QA_v1.json":json.dumps(qa,ensure_ascii=False,indent=2).encode()}
          for path,data in outputs.items():
             body=json.dumps({"message":"INT018 verified Slovenia catalog "+path.rsplit("/",1)[-1],"branch":"main","content":base64.b64encode(data).decode()}).encode()
             req=urllib.request.Request("https://api.github.com/repos/"+repo+"/contents/"+path,method="PUT",data=body,headers={**h,"Content-Type":"application/json"})
             with urllib.request.urlopen(req,timeout=130) as r:print("SAVED",path,len(data),r.status,flush=True)
          print("SUCCESS","registry",len(reg),"method",len(mb),"positive_qas",len(tests),flush=True)
          PY
