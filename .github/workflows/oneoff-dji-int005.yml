name: One-off INT-005 DJI 2023 source forensic
on:
  push:
    paths:
      - .github/workflows/oneoff-dji-int005.yml
permissions:
  contents: write
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Byte-verify source, extract 14 pages and render charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .pdfaudit
          .pdfaudit/bin/pip install -q pymupdf
          .pdfaudit/bin/python - <<'PY'
          import os, urllib.request, hashlib, base64, json, re
          import fitz
          repo=os.environ['GH_REPOSITORY']
          original='space-archive/extra/stp8/Netherlands_DJI_capaciteit_bezetting_jan-apr_2023.pdf'
          origin='https://raw.githubusercontent.com/'+repo+'/main/'+original
          official='https://www.dji.nl/site/binaries/site-content/collections/documents/2023/06/09/capaciteit-en-bezetting-januari-t-m-april-2023/Capaciteit%2Ben%2Bbezetting%2Bjanuari%2Btm%2Bapril%2B2023.pdf'
          def download(url):
            request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 compatible academic source audit'})
            with urllib.request.urlopen(request,timeout=75) as response: return response.read()
          archive=download(origin)
          sha=hashlib.sha1(b'blob '+str(len(archive)).encode()+b'\x00'+archive).hexdigest()
          assert sha=='054f279bd0512d8b3d5e4cf994bcc619d5dbc246',sha
          assert archive[:5]==b'%PDF-'
          publisher=download(official)
          sha256=hashlib.sha256(archive).hexdigest()
          print('original_sha',sha,'bytes',len(archive),'sha256',sha256)
          print('publisher_bytes',len(publisher),'publisher_sha256',hashlib.sha256(publisher).hexdigest(),'byte_equal',archive==publisher)
          doc=fitz.open(stream=archive,filetype='pdf')
          print('page_count',len(doc),'metadata',doc.metadata)
          assert len(doc)==14
          root='prison-research-archive/00_catalog/progress/'
          pages=[]; textpages=[]; images={}
          for j,page in enumerate(doc):
            blocks=[]
            for item in page.get_text('blocks',sort=False):
              x0,y0,x1,y1,t,number,kind=item
              if kind==0 and t.strip(): blocks.append({'x':round(x0,2),'y':round(y0,2),'w':round(x1-x0,2),'h':round(y1-y0,2),'text':t.strip()})
            pages.append({'page':j+1,'width':page.rect.width,'height':page.rect.height,'blocks':blocks})
            textpages.append('## Source PDF page '+str(j+1)+'\n'+page.get_text(sort=True))
            images[root+'INT-005_DJI_2023_original_page_'+str(j+1).zfill(2)+'_visual_QA_v1.png']=page.get_pixmap(matrix=fitz.Matrix(1.18,1.18),alpha=False).tobytes('png')
          outputs={
            root+'INT-005_DJI_2023_original_binary_metadata_v1.json':json.dumps({
              'source_original_path':original,'source_git_sha1':sha,'source_size_bytes':len(archive),
              'source_sha256':sha256,'official_upstream_url':official,
              'official_sha256':hashlib.sha256(publisher).hexdigest(),'official_bytes':len(publisher),
              'byte_identical_official':archive==publisher,'pages':len(doc),'metadata':doc.metadata,
              'publication_date_from_dji_landing':'2023-06-09','source_period':'2023-01 to 2023-04'
            },ensure_ascii=False,indent=2).encode(),
            root+'INT-005_DJI_2023_original_layout_blocks_v1.json':json.dumps(pages,ensure_ascii=False,indent=2).encode(),
            root+'INT-005_DJI_2023_14p_original_text_v1.md':'\n\n'.join(textpages).encode()
          }
          outputs.update(images)
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}
          for path,body in outputs.items():
            data=json.dumps({'message':'audit: INT-005 original DJI source '+path.rsplit('/',1)[-1],
              'branch':'main','content':base64.b64encode(body).decode()}).encode()
            url='https://api.github.com/repos/'+repo+'/contents/'+path
            req=urllib.request.Request(url,data=data,headers=headers,method='PUT')
            with urllib.request.urlopen(req,timeout=45) as response:
              assert response.status==201,(path,response.status)
              print('Saved',path,len(body),response.status)
          PY
