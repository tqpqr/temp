name: Oneoff INT015 registry + method ledger append
on:
  push:
    paths:
      - .github/workflows/oneoff-int015-promote-v1.yml
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Integrate verified INT015 source objects and anomalies
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,io,csv,re,hashlib,os,collections
          repo=os.environ["GH_REPOSITORY"]
          h={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"User-Agent":"ResearchArchive"}
          prefix="prison-research-archive/00_catalog/"
          pfx=prefix+"progress/"
          source="space-archive/extra/stp8/Scotland_AuditScotland_SPS_2022-23_s22.pdf"
          blob="7e993349b17c6ec0f177862134091092ea86f18e"
          sh="915417479d1c41740d8b1d6fb91a8ad2b459e86e24332a207c542b7731e517ff"
          upstream="https://www.audit-scotland.gov.uk/uploads/docs/report/2023/s22_231212_scottish_prison_service.pdf"
          def api_get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=140) as response: return json.load(response)
          def blob_text(sha):
              j=api_get("https://api.github.com/repos/"+repo+"/git/blobs/"+sha)
              return base64.b64decode(j["content"]).decode("utf-8-sig")
          def path_text(path):
              j=api_get("https://api.github.com/repos/"+repo+"/contents/"+path)
              return base64.b64decode(j["content"]).decode("utf-8-sig")
          def parse_csv(txt):
              return list(csv.DictReader(io.StringIO(txt)))
          integrity=json.loads(path_text(pfx+"INT-015_original_PDF_integrity_v2.json"))
          assert integrity["git_blob_sha1"]==blob and integrity["original_sha256"]==sh
          assert integrity["publisher_comparison"]["byte_identical"]==True
          assert integrity["original_pdf_page_count"]==21
          records=parse_csv(blob_text("d21faf7eaa22ac050a87d9ac4d7736ee8e2f878a"))
          breaks=parse_csv(blob_text("c01f994f0576cd5400e43f2b99090806bcd792e6"))
          if len(records)!=1390 or records[-1]["record_id"]!="R01390" or len(breaks)!=67 or breaks[-1]["break_id"]!="MB-067": raise ValueError("Previous registry/MB versions unexpected")
          observations=parse_csv(path_text(pfx+"INT-015_official_source_observations_STAGING_v1.csv"))
          sites=parse_csv(path_text(pfx+"INT-015_Appendix1_18_site_rows_official_visual_STAGING_v1.csv"))
          q3=parse_csv(path_text(pfx+"INT-015_Exhibits1to3_Q3_2020_2023_performance_STAGING_v1.csv"))
          assert len(observations)==35 and len(sites)==18 and len(q3)==12
          columns=["design_capacity_report_2023","extended_operating_capacity_nov2023","target_operating_capacity_nov2023","prisoners_mean_FY2018_19","prisoners_site_max_FY2018_19","prisoners_mean_FY2022_23","prisoners_site_max_FY2022_23","prisoners_2023_11_13"]
          sums=[sum(int(r[c]) for r in sites if r[c]) for c in columns]
          assert sums[:3]==[7905,8475,8007] and sums[-1]==7948 and sums[5]==7437
          grampian=[r for r in sites if r["site_name"]=="Grampian"][0]
          assert grampian[columns[3]]=="460" and grampian[columns[4]]=="450"
          check_q3={"court_arrivals":[89.2,71.8,65.6,61.6],"court_returns":[96,66.3,69.1,62.7],"non_court_appointments":[99.6,96.2,85.3,64.6]}
          q3head=list(q3[0])
          print("Q3 CSV HEAD",q3head,flush=True)
          assert "report_metric" in q3head and "year_Q3" in q3head and "percent" in q3head
          for k,vals in check_q3.items():
              x=sorted((r for r in q3 if r["report_metric"]==k),key=lambda r:int(r["year_Q3"]))
              assert len(x)==4 and [float(r["percent"]) for r in x]==vals,(k,x)
          # Check distinct source universes without manufacturing extra observations.
          assert sum(int(x["value"]) for x in observations if x["period"]=="2023-11-13" and x["metric"] in ["untried","convicted_awaiting_sentence","sentenced_in_custody"])==7948
          assert sum(int(x["value"]) for x in observations if x["period"]=="2023-11-13" and x["metric"] in ["men_in_custody","women_in_custody"])==7948
          regfields=list(records[0]);mbfields=list(breaks[0])
          base={"source_domain":"SC_AUDITSCOTLAND_SPS_S22_2022_23","source_reference":"00_catalog/progress/INT-015_Scotland_AuditScotland_SPS_2022_23_source_audit_v1.md;00_catalog/progress/INT-015_original_PDF_integrity_v2.json","original_source_path":source,"original_git_blob_sha1":blob,"publication_vintage":"AUDIT_SCOTLAND_DECEMBER_2023_PDF_CREATED_2023-12-07","official_upstream_url":upstream,"external_binary_identity":"EXACT_ORIGINAL_ARCHIVE_SHA256_"+sh+";INDEPENDENT_ISSUER_TLS_VALIDATED_BYTE_IDENTICAL","field_coverage_status":"EXACT_ARCHIVED_SOURCE_AND_ISSUER_BIT_IDENTICAL_AND_CHARTS_VISUALLY_VERIFIED","coverage_evidence":"GIT_ORIGINAL_PDF_SHA1_SHA256_BYTES_21_PAGES_VERIFIED;OFFICIAL_ISSUER_EXACT_SHA256;VISUAL_SOURCE_PAGES_8_9_10_15_16_20"}
          def add_reg(changes):
              row=dict.fromkeys(regfields,"")
              row.update(base);row.update(changes)
              row["record_id"]="R"+str(1391+len(records)-1390).zfill(5)
              assert all(k in regfields for k in changes)
              records.append(row)
          def slug(s):return re.sub("[^A-Za-z0-9]+","_",s).strip("_")[:110]
          for item in observations:
              period=item["period"];metric=item["metric"];scope=item["geography_or_agency"];status=item["verification_status"];note=item["scope_caution"]
              is_forecast="FORECAST" in note or "forecast" in metric.lower()
              linked=[]
              if "capacity" in metric or "prison" in metric and scope=="HMP Barlinnie":linked.append("MB-070")
              if "home_detention" in metric or "population_in_custody"==metric or "untried"==metric:linked.append("MB-071")
              if is_forecast or "prison_population_chart" in metric:linked.append("MB-072")
              if "spending" in metric or "capital_" in metric or "staff_" in metric:linked.append("MB-073")
              if period=="FY2022/23" and ("mean" in metric or "max" in metric):linked.append("MB-069")
              add_reg({"record_type":"ORIGINAL_FORECAST_NON_OBSERVED" if is_forecast else "SOURCE_SCOPE_DATE_VERIFIED_NUMERIC",
                "indicator_code":"SC_AUDIT_2023_"+slug(scope)+"_"+slug(metric)+"_"+slug(period),
                "indicator_name_original":metric,"indicator_unit":item["unit"],"territorial_level":scope,
                "temporal_grain":"FY_SOURCE" if period.startswith("FY") else "DATED_SOURCE_OR_YEARLY_SOURCE","first_period_recorded":period,"last_period_recorded":period,
                "listed_periods_exact":period,"distinct_nominal_years":"10" if "2013/14" in period else "1",
                "reporting_window_type":"FORECAST_NOT_OBSERVED" if is_forecast else "EXACT_SOURCE_DATED_OR_FY",
                "numeric_evidence":"EXACT_SOURCE_VALUE_"+item["value"],"source_cell_anchor":item["pdf_anchor"],
                "important_limitations":note+"; 2023 issuer report; forecast explicitly not actual" if is_forecast else note,
                "observed_value_raw":item["value"],"measurement_status":"PROJECTION_FUTURE_NOT_OBSERVED" if is_forecast else "PUBLISHED_ORIGINAL_PRIMARY_SOURCE_VALUE",
                "linked_break_ids":";".join(dict.fromkeys(linked)),
                "number_of_source_records":"1"})
          facility_nonempty=sum(1 for r in sites for col in columns if r[col])
          add_reg({"record_type":"SOURCE_FACILITY_TABLE_WITH_MIXED_PERIODS_NOT_NATIONAL_SERIES",
              "indicator_code":"SC_AUDIT_2023_Appendix1_18_site_eight_dimension_evidence",
              "indicator_name_original":"Appendix 1 Scottish Prison Service establishment capacity and population table",
              "indicator_unit":"mixed_places_and_persons_8_source_columns",
              "territorial_level":"Scotland facility/site/centre 18 printed rows",
              "temporal_grain":"FY2018_19_AND_FY2022_23_SITE_AVG_AND_MAX_PLUS_NOV2023_CAPACITY_AND_2023_11_13_STOCK",
              "first_period_recorded":"FY2018/19","last_period_recorded":"2023-11-13",
              "listed_periods_exact":"FY2018/19;FY2022/23;2023-11_capacity;2023-11-13_population",
              "distinct_nominal_years":"3","reporting_window_type":"MULTI_PERIOD_SOURCE_SITE_ROWS_NOT_ONE_COHERENT_SNAPSHOT",
              "numeric_evidence":"18_SOURCE_ROWS_8_FIELDS_4_TOTALS_RECONCILED_TO_PUBLISHER",
              "source_reference":base["source_reference"]+";00_catalog/progress/INT-015_Appendix1_18_site_rows_official_visual_STAGING_v1.csv",
              "source_cell_anchor":"PDF_PHYSICAL_PAGE_20_Appendix1_18_original_rows",
              "important_limitations":"Grampian FY2018/19 mean460 exceeds peak450 printed; FY2022/23 sum of site means7437 differs from Scottish FY mean7426; sites include closures/new openings; no interpreting institution site maxima sum as simultaneous country max",
              "observed_value_raw":"","measurement_status":"VERIFIED_MULTIVARIABLE_SOURCE_TABLE_NOT_ADDITIVE_ONE_VALUE",
              "linked_break_ids":"MB-068;MB-069;MB-070",
              "source_facility_rows":"18",
              "number_of_numeric_facility_cells":str(facility_nonempty),
              "number_of_publisher_blank_facility_cells":str(18*8-facility_nonempty),
              "original_publisher_total_value":"DESIGN=7905;EXTENDED=8475;TARGET=8007;NOV13_PEOPLE=7948",
              "number_of_source_records":"18"})
          for metric,values in check_q3.items():
              subset=sorted((r for r in q3 if r["report_metric"]==metric),key=lambda r:int(r["year_Q3"]))
              vals=[r["percent"] for r in subset]
              add_reg({"record_type":"ORIGINAL_4_YEAR_CALENDAR_Q3_QUARTERLY_PERFORMANCE_SERIES",
                "source_domain":"SC_SCCPES_ESCORT_CONTRACTOR_SERVICE_DELIVERY",
                "indicator_code":"SC_AUDIT_2023_Q3_2020_2023_"+metric,
                "indicator_name_original":metric+" quarterly Q3 on-time percent",
                "indicator_unit":"percent","territorial_level":"Scotland SCCPES contractor service scope",
                "temporal_grain":"calendar_year_quarter_3","first_period_recorded":"2020-Q3","last_period_recorded":"2023-Q3",
                "listed_periods_exact":"2020-Q3;2021-Q3;2022-Q3;2023-Q3",
                "distinct_nominal_years":"4","reporting_window_type":"Q3_2020_2023_NOT_ANNUAL_AND_NOT_PRISON_STOCK",
                "numeric_evidence":";".join(a+"="+b+"%" for a,b in zip(["2020Q3","2021Q3","2022Q3","2023Q3"],vals)),
                "source_reference":base["source_reference"]+";00_catalog/progress/INT-015_Exhibits1to3_Q3_2020_2023_performance_STAGING_v1.csv",
                "source_cell_anchor":"PDF_PHYSICAL_PAGE_"+subset[0]["source_pdf_physical_page"]+"_Exhibit_"+subset[0]["source_exhibit"],
                "important_limitations":"4 accurately labelled visual percentages; graph lower bars NOT exact movement totals; contractual punctuality NOT prisoner population or prison FTE",
                "measurement_status":"SOURCE_VISUAL_4_OBSERVATION_SERIES","number_of_source_records":"4"})
          assert len(records)==1429 and len(set(r["record_id"] for r in records))==1429
          problems=[
          ("MB-068","Scotland / HMP Grampian","SOURCE_INTERNAL_SITE_FY_MEAN_EXCEEDS_SAME_PERIOD_MAX","FY2018/19","Audit report Dec2023","PDF p20 Appendix1 Grampian mean460","PDF p20 Appendix1 Grampian maximum450","Published mean 460 > maximum 450 for HMP Grampian 2018/19. Same-scope maximum should never be below same-scope average. Publisher source original visually and bit-identically confirmed.","Printed inconsistency verified; cannot know whether either number or caption mistaken.","CONFIRMED_PRINTED_ANOMALY_CAUSE_UNRESOLVED","Never silently fix 460/450 or rely on Grampian 2018/19 figure without flagged anomaly.","Find any issuer amendment/reconciliation, without contacting agency."),
          ("MB-069","Scotland / site aggregates vs SPS national","INSTITUTION_FY_MEANS_SUM_DOES_NOT_RECONCILE_NATIONAL_FY_MEAN","FY2022/23","2022/23 18 facility rows","PDF p20 Appendix1 18 site averages sum=7437","PDF p14 para40 Scottish mean=7426","+11 difference between sum of all original FY2022/23 printed site means=7437 and publisher national mean=7426. Reasons including differing temporal weights and dynamic institution rosters have not been proven.","Reason and exact population time weights unavailable.","CONFIRMED_ARITHMETIC_GAP_CAUSE_UNRESOLVED","Do not force institution rows to sum to national mean; do not add independent site peaks as country peak.","Cross-check SPS 2022/23 annual data from INT016 before bridging."),
          ("MB-070","Scotland / Nov2023 site capacity denominators","DESIGN_TARGET_EXTENDED_CAPACITY_ARE_DIFFERENT_AND_DIFFERENT_FROM_FY_POPULATION","FY2022/23 national average","Nov2023 snapshot","PDF p14 paras40-42 FY mean7426","PDF p20 Appendix1 total design7905 target8007 extended8475 and 13Nov prisoners7948","Three different capacity denominator concepts at November2023: design7905, target8007, extended8475. Extended capacity requires restricted regime; neither can be denominator for FY2022/23 average population without time alignment.","Source definitions verified, exact historical month-by-month denominator unknown.","CONFIRMED_PERIMETER_DENOMINATOR_GRAIN_DIFFERENCE","Do not combine 2022/23 FY average with November 2023 capacity as contemporaneous yearly occupancy or average.","Find month-specific capacity/population in INT016 if available."),
          ("MB-071","Scotland / custody versus home detention curfew","PRISON_POPULATION_AND_HOME_DETENTION_CURFEW_DIFFERENT_STATISTICAL_UNIVERSES","2023-11-13 in custody","2023-11-13 home detention curfew","PDF p16 Exhibit5 in custody7948","PDF p16 Exhibit5 HDC60","Separate 7948 persons actually in custody and 60 Home Detention Curfew persons out of prison. The home detention figure cannot simply be added to in-custody occupancy numerator.","Publisher explicitly separates groups.","CONFIRMED_POPULATION_SCOPE_DIFFERENCE","Do not add 60 to 7948 or use HDC prisoners for prison physical-capacity occupancy.","Keep HDC as noncustodial separate metric."),
          ("MB-072","Scotland / late 2023 projected occupancy chart","FUTURE_FORECAST_AFTER_PUBLICATION_MIXED_WITH_OBSERVED_CHART","2023-10-13 observed","2023-12-22 and 2024-03-29 projected","PDF p15 Exhibit4 13Oct observed7935","PDF p15 Exhibit4 shaded future 22Dec7932 and 29Mar8166","Exhibit 4 explicitly shades predictions after December 15 2023; figures 7932 and 8166 are forecast, not post-report observational series.","Publisher forecast/actual boundary explicitly marked.","CONFIRMED_CHART_FORECAST_CENSORING","Never place forecast values into historical inmate time series as realised.","Look up later actuals only via independent dated official publication."),
          ("MB-073","Scotland / SPS expenditure and personnel FY2022/23","TOTAL_SPEND_CAPEX_COMPONENT_AND_ESTABLISHMENT_NOT_ACTUAL_GUARD_FTE","FY2022/23 full agency expenditure","FY2022/23 capex/staff components","PDF p5 para8 £499m total including capex£70.9m","PDF p5 para8 staff expenditure£221.7m and establishment4562","£499m expenditure includes £70.9m capital; £221.7m resource staff costs; 4562 establishment is not measured year-average uniformed prison guards. Cross-country imprisonment cost/person or FTE comparisons need correct perimeter.","Issuer labels verified; no audited guard-FTE series in this report.","CONFIRMED_ACCOUNTING_SCOPE_AND_HEADCOUNT_DEFINITION","Do not double-add capital, treat 4562 as annual realised guarding FTE, or infer annual spending elasticity from a single FY.","Use SPS annual accounts INT016 for comparable guard-FTE and relevant expense perimeter.")
          ]
          for idx,(bid,geo,typ,earlier,later,cella,cellb,explanation,causal,status,prohibit,nextcheck) in enumerate(problems):
              r=dict.fromkeys(mbfields,"")
              r.update({"break_id":bid,"geography_and_scope":geo,"issue_type":typ,"earlier_period":earlier,"later_period":later,
                "original_source_a":source,"git_sha_a":blob,"original_cell_a":cella,
                "original_source_b":source,"git_sha_b":blob,"original_cell_b":cellb,
                "exact_observation":explanation,
                "existing_evidence_artifact":"progress/INT-015_Scotland_AuditScotland_SPS_2022_23_source_audit_v1.md;progress/INT-015_Appendix1_18_site_rows_official_visual_STAGING_v1.csv;progress/INT-015_original_PDF_integrity_v2.json",
                "causal_explanation_status":causal,"triage_status":status,"must_not_do":prohibit,"resumption_or_next_check":nextcheck})
              breaks.append(r)
          assert len(breaks)==73 and len(set(r["break_id"] for r in breaks))==73
          def write_csv(data,fields):
              output=io.StringIO(newline="")
              writer=csv.DictWriter(output,fieldnames=fields,quoting=csv.QUOTE_ALL,lineterminator="\n",extrasaction="raise")
              writer.writeheader()
              writer.writerows(data)
              return output.getvalue().encode("utf-8")
          regbytes=write_csv(records,regfields)
          mbbytes=write_csv(breaks,mbfields)
          qa={"INT":"INT-015","archived_original_sha256":sh,"official_binary_identical":True,"PDF_pages":21,"previous_registry_rows":1390,"appended_obs":35,"appended_appendix_site_table_object":1,"appended_Q3_series_objects":3,"new_registry_rows":len(records),"previous_mb_rows":67,"added_methodological_breaks":[p[0] for p in problems],"new_mb_rows":len(breaks),"appendix_site_rows":len(sites),"numeric_cells":facility_nonempty,"blanks":18*8-facility_nonempty,"verified_appendix_column_sums":{"design":sums[0],"extended":sums[1],"target":sums[2],"2023_11_13_custody":sums[-1],"2022_23_sum_site_means":sums[5]},"unresolved_source_gaps":["Grampian 2018/19 460 avg vs 450 peak","FY2022/23 sum of site avg7437 vs system avg7426"],"quarterly_chart_values_checked":12}
          files={prefix+"INDICATOR_PERIOD_COVERAGE_REGISTRY_v28.csv":regbytes,prefix+"METHODOLOGICAL_BREAKS_AND_ANOMALIES_v30.csv":mbbytes,pfx+"INT-015_catalog_integration_QA_v1.json":json.dumps(qa,ensure_ascii=False,indent=2).encode("utf-8")}
          for p,dat in files.items():
              body=json.dumps({"message":"catalog: complete INT015 verified Scotland source "+p.split("/")[-1],"branch":"main","content":base64.b64encode(dat).decode()}).encode("utf-8")
              req=urllib.request.Request("https://api.github.com/repos/"+repo+"/contents/"+p,data=body,method="PUT",headers={**h,"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=120) as res: print("SAVED",p,"bytes",len(dat),res.status,flush=True)
          print("SUCCESS",json.dumps(qa),flush=True)
          PY
