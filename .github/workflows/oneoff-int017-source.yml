name: Oneoff INT017 Slovakia primary source PDF check
on:
  push:
    paths:
      - .github/workflows/oneoff-int017-source.yml
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Verify archived Git blob and official ministry PDF, extract pages
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,io,sys,json,base64,hashlib,urllib.request,subprocess,re
          from datetime import datetime,timezone
          repo=os.environ["GH_REPOSITORY"];tok=os.environ["GH_TOKEN"]
          src="space-archive/extra/stp8/Slovakia_II_Cinnost_ZVJS_2021.pdf"
          sha="1d6cfcddd12bba2aa17577343781a1e7276904ec";size=2013675
          upstream="https://www.justice.gov.sk/dokumenty/2025/03/II.-Cinnost-Zboru-vazenskej-a-justicnej-straze-2021.pdf"
          head={"Authorization":"Bearer "+tok,"User-Agent":"ResearchArchive-SK-INT017"}
          req=urllib.request.Request("https://api.github.com/repos/"+repo+"/git/blobs/"+sha,headers=head)
          with urllib.request.urlopen(req,timeout=155) as r:blob=json.load(r)
          original=base64.b64decode(blob["content"])
          assert len(original)==size,(len(original),size)
          calculated=hashlib.sha1(b"blob "+str(len(original)).encode()+bytes([0])+original).hexdigest()
          assert calculated==sha,(calculated,sha)
          report={"path":src,"git_sha1":sha,"bytes":size,"sha256":hashlib.sha256(original).hexdigest(),"official_url":upstream,"checked_utc":datetime.now(timezone.utc).isoformat(),"publisher":{}}
          print("ORIGINAL_VERIFIED",size,report["sha256"],flush=True)
          try:
            req=urllib.request.Request(upstream,headers={"User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(req,timeout=135) as r:
              external=r.read()
              report["publisher"]={"http":r.status,"tls_verified":True,"final_url":r.url,"bytes":len(external),"sha256":hashlib.sha256(external).hexdigest(),"byte_identical":external==original}
          except Exception as e:
            report["publisher"]={"error":type(e).__name__+": "+str(e)[:400],"byte_identical":None}
          subprocess.check_call([sys.executable,"-m","pip","install","-q","--target","/tmp/pypdfint017","pypdf"])
          sys.path.insert(0,"/tmp/pypdfint017")
          from pypdf import PdfReader
          reader=PdfReader(io.BytesIO(original))
          pages=[p.extract_text(extraction_mode="layout") or "" for p in reader.pages]
          report["physical_pages"]=len(pages)
          report["pdf_metadata"]={str(k):str(v) for k,v in (reader.metadata or {}).items()}
          report["page_text_lengths"]=[len(x) for x in pages]
          report["thin_text_pages"]=[i+1 for i,x in enumerate(pages) if len(x)<120]
          prefix="prison-research-archive/00_catalog/progress/"
          files={"INT-017_original_PDF_integrity_v1.json":json.dumps(report,indent=2,ensure_ascii=False).encode()}
          for a in range(0,len(pages),10):
            b=min(len(pages),a+10)
            name="INT-017_original_pdf_page_text_%03d_%03d_v1.md"%(a+1,b)
            files[name]="\n\n".join("## Physical PDF page %d\n\n%s"%(i+1,pages[i]) for i in range(a,b)).encode()
          for name,raw in files.items():
            url="https://api.github.com/repos/"+repo+"/contents/"+prefix+name
            payload=json.dumps({"message":"INT017 source forensic "+name,"content":base64.b64encode(raw).decode(),"branch":"main"}).encode()
            req=urllib.request.Request(url,headers={**head,"Content-Type":"application/json"},method="PUT",data=payload)
            with urllib.request.urlopen(req,timeout=135) as r:print("UPLOADED",name,len(raw),r.status,flush=True)
          print("SUCCESS",json.dumps({"pages":len(pages),"issuer_comparison":report["publisher"]}),flush=True)
          PY
