name: Oneoff INT014 official CZSW 2022 issuer matching
on:
  push:
    paths:
      - .github/workflows/oneoff-int014-issuer.yml
permissions:
  contents: write
jobs:
  issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare archival SHA256 against two official annual 2022 PDF URLs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,urllib.request,ssl,hashlib,json,base64
          urls=["https://sw.gov.pl/assets/58/16/14/76218cbc9fe6ac2dfdd1c4f4f28a48ce8cf0d11d.pdf",
          "https://www.sw.gov.pl/assets/58/16/14/fdb5af0ddcb457121b39f7ab111fcbfc7a749cba.pdf"]
          expected="d54adff04ba1e7eb8a1437e60c4ea5fe8d0535535e30c65d2fd393fed0d05413"
          out={"expected_original_archive_sha256":expected,"source":"official CZSW annual statistics page linked PDF 2022","candidate_checks":[]}
          for url in urls:
           row={"original_official_url":url}
           for mode in ["validated_tls","unverified_TLS_hash_check_ONLY"]:
            try:
             headers={"User-Agent":"Mozilla/5.0"}
             ctx=ssl.create_default_context() if mode=="validated_tls" else ssl._create_unverified_context()
             with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=85,context=ctx) as r:
              data=r.read();row[mode]={"http_status":r.status,"url":r.url,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"identical_hash_to_archive":hashlib.sha256(data).hexdigest()==expected,"tls_certificate_validation":mode=="validated_tls"}
             if mode=="validated_tls":break
            except Exception as e:row[mode]={"error":type(e).__name__+": "+str(e)[:280]}
           out["candidate_checks"].append(row)
          data=json.dumps(out,ensure_ascii=False,indent=2).encode()
          p="prison-research-archive/00_catalog/progress/INT-014_official_pdf_two_assets_SHA_comparison_v1.json"
          payload=json.dumps({"message":"source INT014 official 2022 issuer asset SHA comparison","content":base64.b64encode(data).decode(),"branch":"main"}).encode()
          req=urllib.request.Request("https://api.github.com/repos/"+os.environ["GH_REPOSITORY"]+"/contents/"+p,method="PUT",data=payload,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Content-Type":"application/json","User-Agent":"Archive"})
          with urllib.request.urlopen(req,timeout=75) as r:print("SAVED",len(data),r.status)
          print(out,flush=True)
          PY
