name: Oneoff INT019 Estonia archived PDF provenance
on:
  push:
    paths:
      - .github/workflows/oneoff-int019-source.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Verify archived original and Council of Europe document, extract page text
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,sys,json,hashlib,base64,urllib.request,io,subprocess
          from datetime import datetime,timezone
          repo=os.environ["GH_REPOSITORY"];tok=os.environ["GH_TOKEN"]
          path="space-archive/extra/stp8/Estonia_CPT-Inf_2024_27.pdf"
          sha="bd9949bfe933fbf00c745a4a8b4fa39562492e4b";size=1058916
          official="https://rm.coe.int/1680b13704"
          h={"Authorization":"Bearer "+tok,"User-Agent":"INT019-ForensicArchive"}
          def req(url,headers):
            return urllib.request.Request(url,headers=headers)
          with urllib.request.urlopen(req("https://api.github.com/repos/"+repo+"/git/blobs/"+sha,h),timeout=155) as r:blob=json.load(r)
          data=base64.b64decode(blob["content"])
          assert len(data)==size,(len(data),size)
          git_hash=hashlib.sha1(b"blob "+str(len(data)).encode("ascii")+bytes([0])+data).hexdigest()
          assert git_hash==sha,(git_hash,sha)
          obj={"archived_path":path,"archived_git_sha1":sha,"archived_bytes":len(data),"archived_sha256":hashlib.sha256(data).hexdigest(),"official_url":official,"checked_utc":datetime.now(timezone.utc).isoformat()}
          try:
            with urllib.request.urlopen(req(official,{"User-Agent":"Mozilla/5.0"}),timeout=140) as r:
              other=r.read()
              obj["publisher_comparison"]={"status":r.status,"tls_verified":True,"final_url":r.url,"publisher_bytes":len(other),"publisher_sha256":hashlib.sha256(other).hexdigest(),"identical_bytes":other==data}
          except Exception as e:obj["publisher_comparison"]={"identical_bytes":None,"error":type(e).__name__+": "+str(e)[:330]}
          subprocess.check_call([sys.executable,"-m","pip","install","-q","--target","/tmp/int019pypdf","pypdf"])
          sys.path.insert(0,"/tmp/int019pypdf")
          from pypdf import PdfReader
          p=PdfReader(io.BytesIO(data))
          pages=[v.extract_text(extraction_mode="layout") or "" for v in p.pages]
          obj["pages"]=len(pages);obj["pdf_metadata"]={str(k):str(v) for k,v in (p.metadata or {}).items()}
          obj["page_text_lengths"]=[len(x) for x in pages]
          source_prefix="prison-research-archive/00_catalog/progress/"
          files={"INT-019_original_PDF_integrity_v1.json":json.dumps(obj,ensure_ascii=False,indent=2).encode("utf-8")}
          for start in range(0,len(pages),10):
            end=min(start+10,len(pages))
            files["INT-019_original_pdf_page_text_%03d_%03d_v1.md"%(start+1,end)]="\n\n".join("## Physical PDF page %d\n\n%s"%(i+1,pages[i]) for i in range(start,end)).encode()
          for name,raw in files.items():
            body=json.dumps({"message":"INT019 original CPT government response source "+name,"content":base64.b64encode(raw).decode(),"branch":"main"}).encode()
            request=urllib.request.Request("https://api.github.com/repos/"+repo+"/contents/"+source_prefix+name,data=body,method="PUT",headers={**h,"Content-Type":"application/json"})
            with urllib.request.urlopen(request,timeout=115) as r:print("UPLOADED",name,len(raw),r.status,flush=True)
          print("VERIFIED",json.dumps({"pages":len(pages),"archived_sha256":obj["archived_sha256"],"publisher":obj["publisher_comparison"]}),flush=True)
          PY
