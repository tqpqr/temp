name: One-off INT-008 read-only Latvian DOCX inspection
on:
  push:
    paths:
      - .github/workflows/oneoff-int008-docx.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: SHA-verified original OOXML forensic extraction
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, hashlib, zipfile, io, json, xml.etree.ElementTree as ET, csv, base64, datetime
          repo=os.environ["GH_REPOSITORY"]
          source="space-archive/extra/stp8/2020-gada-statistika.docx"
          url="https://raw.githubusercontent.com/"+repo+"/main/"+source
          data=urllib.request.urlopen(url,timeout=90).read()
          gitsha=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\\0"+data).hexdigest()
          assert (len(data),gitsha)==(1088041,"5ff8e66877befd63836d89bf68b10721c3514326"),(len(data),gitsha)
          assert data[:2]==b"PK"
          z=zipfile.ZipFile(io.BytesIO(data))
          assert z.testzip() is None
          members=z.namelist()
          assert "word/document.xml" in members
          W="{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
          ns={"w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
          doc=ET.fromstring(z.read("word/document.xml")); body=doc.find("w:body",ns)
          def ptext(el):
            out=[]
            for c in el.iter():
              if c.tag==W+"t":out.append(c.text or "")
              elif c.tag==W+"tab":out.append("\\t")
              elif c.tag in (W+"br",W+"cr"):out.append(" | ")
            return "".join(out).strip()
          par=[]
          cells=[]
          tab_summary=[]
          tables=0
          for body_index,el in enumerate(list(body),1):
            if el.tag==W+"p":
              t=ptext(el)
              if t:par.append([body_index,t])
            elif el.tag==W+"tbl":
              tables+=1
              rows=el.findall("w:tr",ns)
              totalcells=0
              preview=[]
              for ridx,tr in enumerate(rows,1):
                current=[]
                for cidx,tc in enumerate(tr.findall("w:tc",ns),1):
                  t=ptext(tc)
                  colspan=tc.find("w:tcPr/w:gridSpan",ns)
                  colval=colspan.get(W+"val") if colspan is not None else ""
                  merged=tc.find("w:tcPr/w:vMerge",ns)
                  mval=merged.get(W+"val","continue") if merged is not None else ""
                  cells.append([tables,body_index,ridx,cidx,colval,mval,t])
                  current.append(t[:120])
                  totalcells+=1
                if ridx<=5:preview.append(current[:10])
              tab_summary.append({"table":tables,"body_index":body_index,"rows":len(rows),"cells":totalcells,"preview":preview})
          metadata={}
          if "docProps/core.xml" in members:
            root=ET.fromstring(z.read("docProps/core.xml"))
            metadata={e.tag.split("}")[-1]:e.text for e in root if e.text}
          alltext="\\n".join(x[1] for x in par)+"\\n"+"\\n".join(str(x[-1]) for x in cells)
          info={
           "source_path":source,"source_bytes":len(data),"git_blob_sha1":gitsha,"sha256":hashlib.sha256(data).hexdigest(),
           "zip_valid":True,"docx_components":len(members),"document_xml_bytes":len(z.read("word/document.xml")),
           "body_top_level_elements":len(list(body)),"top_level_nonempty_paragraphs":len(par),"top_level_tables":tables,
           "table_cells":len(cells),"xml_body_total_extracted_text_characters":len(alltext),
           "embedded_media":[{"path":k,"bytes":z.getinfo(k).file_size} for k in members if k.startswith("word/media/")],
           "embedded_charts":[k for k in members if k.startswith("word/charts/")],
           "other_embedded":[k for k in members if k.startswith("word/embeddings/")],
           "core_properties":metadata,"first_paragraphs":par[:70],
           "table_structural_summary":tab_summary,
           "non_document_xml_parts":[k for k in members if k.startswith("word/") and k.endswith(".xml") and k!="word/document.xml"]
          }
          prefix="prison-research-archive/00_catalog/progress/"
          def csvbytes(rows):
            buf=io.StringIO();writer=csv.writer(buf,lineterminator="\\n");writer.writerows(rows);return buf.getvalue().encode("utf-8")
          outputs={prefix+"INT-008_DOCX_binary_and_structure_inventory_v1.json":json.dumps(info,ensure_ascii=False,indent=2).encode("utf-8")}
          for stem,header,rows in [
            ("INT-008_original_body_paragraphs",["body_element_1based","text_original"],par),
            ("INT-008_original_all_table_cells",["table_1based","body_element_1based","table_row_1based","table_col_1based","grid_span","vertical_merge","text_original"],cells)]:
            chunk=[];part=1
            for row in [header]+rows:
              if len(csvbytes(chunk+[row]))>650000 and len(chunk)>1:
                outputs[prefix+stem+"_part"+str(part).zfill(2)+"_v1.csv"]=csvbytes(chunk)
                part+=1;chunk=[header]
              chunk.append(row)
            if chunk:outputs[prefix+stem+"_part"+str(part).zfill(2)+"_v1.csv"]=csvbytes(chunk)
          for path,body in outputs.items():
            api="https://api.github.com/repos/"+repo+"/contents/"+path
            payload=json.dumps({"message":"forensic: INT-008 source-only DOCX extraction "+path.rsplit("/",1)[-1],"content":base64.b64encode(body).decode(),"branch":"main"}).encode()
            req=urllib.request.Request(api,data=payload,method="PUT",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"})
            with urllib.request.urlopen(req,timeout=65) as result: print("saved",path,len(body),result.status)
          print("SUCCESS",len(data),len(par),tables,len(cells),len(outputs))
          
          PY
