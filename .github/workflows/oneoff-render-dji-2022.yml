name: One-off DJI chart pages raster QA
on:
  push:
    paths:
      - .github/workflows/oneoff-render-dji-2022.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Render exact DJI source for visual QA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .pdf-render
          .pdf-render/bin/pip install --quiet pymupdf
          .pdf-render/bin/python - <<'PY'
          import fitz,urllib.request,os,hashlib,json,base64
          raw='https://raw.githubusercontent.com/'+os.environ['GH_REPOSITORY']+'/main/space-archive/extra/stp8/Netherlands_DJI_capaciteit_bezetting_sep-dec_2022.pdf'
          with urllib.request.urlopen(raw,timeout=50) as r:data=r.read()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\x00'+data).hexdigest()=='db2f73de005d37842c06290a0d27b8a83aa8e6cc'
          doc=fitz.open(stream=data,filetype='pdf')
          for ix in (1,2,3,4,6,7,9,10,12):
            out=doc[ix].get_pixmap(matrix=fitz.Matrix(1.2,1.2),alpha=False).tobytes('png')
            path='prison-research-archive/00_catalog/progress/INT-004_DJI_2022_original_page_'+str(ix+1).zfill(2)+'_visual_QA_v1.png'
            url='https://api.github.com/repos/'+os.environ['GH_REPOSITORY']+'/contents/'+path
            payload=json.dumps({'message':'audit: original DJI PDF page '+str(ix+1)+' visual geometry check',
              'branch':'main','content':base64.b64encode(out).decode()}).encode()
            req=urllib.request.Request(url,data=payload,method='PUT',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=40) as r: print(path,'status',r.status,'bytes',len(out))
          PY
