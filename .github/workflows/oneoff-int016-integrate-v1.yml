name: Oneoff INT016 integrate SPS 2022-23 verified source
on:
  push:
    paths:
      - .github/workflows/oneoff-int016-integrate-v1.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: QA original appendix tables, extend indicator and methodology registers
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,base64,csv,io,urllib.request,re
          repo=os.environ["GH_REPOSITORY"]
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"User-Agent":"INT016-Archive"}
          root="prison-research-archive/00_catalog/"
          progress=root+"progress/"
          original="space-archive/extra/stp8/Scotland_SPS_Annual_Report_2022-23.pdf"
          sha="ec737ad980939b3f9cb385e54e9548b6417f7cb5"
          sha256="d5cead44be22abe077baaca03795265688dfcea2374f110291a067803997626c"
          upstream="https://www.sps.gov.uk/sites/default/files/2024-02/AnnualReportAndAccounts_2022-2023_CorporateReports.pdf"
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=150) as rr:return json.load(rr)
          def blobtext(sha):
            x=get("https://api.github.com/repos/"+repo+"/git/blobs/"+sha)
            return base64.b64decode(x["content"]).decode("utf-8-sig")
          def filetext(path):
            x=get("https://api.github.com/repos/"+repo+"/contents/"+path)
            return base64.b64decode(x["content"]).decode("utf-8-sig")
          def parse(t):return list(csv.DictReader(io.StringIO(t)))
          integ=json.loads(filetext(progress+"INT-016_original_PDF_integrity_v1.json"))
          assert integ["original_git_sha1"]==sha and integ["original_sha256"]==sha256
          assert integ["original_bytes"]==2886914 and integ["physical_pdf_pages"]==128
          assert integ["official_comparison"]["exact_byte_identical"] is True and integ["official_comparison"]["tls_validated"] is True
          indicator=parse(blobtext("a1ee59fafaa5d5173bdfee50c7c98891ff25c316"))
          breaks=parse(blobtext("d52466d6b9ac5440d89376ad58e5296dfc3a5412"))
          series=parse(filetext(progress+"INT-016_finance_staff_population_two_FY_source_series_v1.csv"))
          facilities=parse(filetext(progress+"INT-016_Appendix3_original_20_rows_2021_22_2022_23_v1.csv"))
          assert len(indicator)==1429 and indicator[-1]["record_id"]=="R01429",len(indicator)
          assert len(breaks)==73 and breaks[-1]["break_id"]=="MB-073",len(breaks)
          assert len(series)==44 and len(facilities)==20,(len(series),len(facilities))
          assert len(set((r["source_section"],r["indicator"]) for r in series))==44
          vals={(r["source_section"],r["indicator"]):r for r in series}
          def V(section,field,fy="FY2022_23_source_value"):return int(vals[section,field][fy])
          qa=[
            ["fy22_23_legal_population",V("People_legal","remand_annual_average")+V("People_legal","sentenced_under_4_years_annual_average")+V("People_legal","sentenced_4years_and_over_annual_average"),7426],
            ["fy21_22_legal_population",sum(V("People_legal",k,"FY2021_22_comparator_as_published") for k in ["remand_annual_average","sentenced_under_4_years_annual_average","sentenced_4years_and_over_annual_average"]),7505],
            ["fy22_23_wte",V("People_staff","year_average_direct_employed_FTE")+V("People_staff","year_average_other_FTE"),4264],
            ["fy21_22_wte",V("People_staff","year_average_direct_employed_FTE","FY2021_22_comparator_as_published")+V("People_staff","year_average_other_FTE","FY2021_22_comparator_as_published"),4290],
            ["fy22_23_gender_staff",V("People_staff","male_staff_year_end")+V("People_staff","female_staff_year_end"),4562],
            ["fy21_22_gender_staff",V("People_staff","male_staff_year_end","FY2021_22_comparator_as_published")+V("People_staff","female_staff_year_end","FY2021_22_comparator_as_published"),4589],
            ["fy22_23_operating_gross",V("SoCNE","staff_costs")+V("SoCNE","other_operating_expenditure"),429130],
            ["fy22_23_net_operating",V("SoCNE","total_operating_expenditure")+V("SoCNE","operating_income"),422575],
            ["fy22_23_net_spend",V("SoCNE","net_operating_expenditure")+V("SoCNE","finance_expense"),428101],
            ["fy22_23_segment_gross",sum(V("Note22_segments",x) for x in ["public_prisons_expenditure","private_prisons_expenditure","escort_SCCPES_expenditure"]),434656],
            ["fy22_23_segment_net",sum(V("Note22_segments",x) for x in ["public_prisons_net_expenditure","private_prisons_net_expenditure","escort_SCCPES_net_expenditure"]),428101],
            ["fy22_23_segment_assets",sum(V("Note22_segments",x) for x in ["public_prisons_noncurrent_assets","private_prisons_noncurrent_assets","escort_SCCPES_noncurrent_assets"]),1323507],
          ]
          assert all(calc==expected for _,calc,expected in qa),[x for x in qa if x[1]!=x[2]]
          def number(v):
            return 0 if v in ("","-") else int(v)
          sums_22=sum(number(r["FY2022_23_average_total"]) for r in facilities)
          sums_21=sum(number(r["FY2021_22_average_total"]) for r in facilities)
          assert sums_22==7437 and sums_21==7504,(sums_22,sums_21)
          counts22=sum(1 for row in facilities for k in row if k.startswith("FY2022_23_") and row[k] not in ("","-"))
          counts21=sum(1 for row in facilities for k in row if k.startswith("FY2021_22_") and row[k] not in ("","-"))
          # Existing MB-069 source gap now specifically explained as not addable because of unequal site windows, decomposition remains open
          mb069=next(r for r in breaks if r["break_id"]=="MB-069")
          mb069["existing_evidence_artifact"]+=";progress/INT-016_Scotland_SPS_2022_23_primary_source_audit_v1.md;progress/INT-016_Appendix3_original_20_rows_2021_22_2022_23_v1.csv"
          mb069["causal_explanation_status"]="Official SPS Appendix3 confirms unequal reference periods for Bella (opened 2022-08-02), Lilias (opened 2022-10-26) and Cornton Vale (closed 2023-03-02), plus published site-level rounded means; cause of EXACT +11 person numerical decomposition unverified."
          mb069["triage_status"]="SOURCE_NONADDITIVITY_BY_TIME_WINDOWS_CONFIRMED_EXACT_11_PERSON_BRIDGE_OPEN"
          mb073=next(r for r in breaks if r["break_id"]=="MB-073")
          mb073["existing_evidence_artifact"]+=";progress/INT-016_finance_staff_population_two_FY_source_series_v1.csv"
          mb073["causal_explanation_status"]+=" Independent SPS 2022/23 p67 reports year-end staff4562 vs p69 FY-average4264 FTE, p81 net year expense428101k GBP; these are different metrics from £499m broader total."
          breaks_new=[
            ["MB-074","Scotland SPS Appendix3 FY institution means","SITE_YEAR_AVERAGES_WITH_OPENING_CLOSING_PARTIAL_PERIOD_ARE_NOT_COUNTRY_FULL_FY_ADDITIVE","FY2022/23 fiscal window","August2022 March2023 facility operation dates","PDF p113 Appendix3 Bella/Lilias/Cornton partial-year footnotes","PDF p113 Appendix3 site mean rows sum7437 vs system7426","Bella average only after 2 Aug2022, Lilias after26 Oct2022, Cornton Vale only through 2Mar2023, while national annual mean uses whole-year source concept. Overlap with MB-069; no exact weighted decomposition. Year 2021/22 source row sum7504 versus national7505 shows conventional rounding too.","VERIFIED_UNEQUAL_SITE_OBSERVATION_WINDOWS;EXACT_GAP_DECOMPOSITION_NOT_PROVEN","Do not sum different-window institution FY means or force +11 into any one institution.","Reconstruct daily weighted institution data if available, no issuer correspondence."],
            ["MB-075","Scotland SPS workforce, 2021/22 vs2022/23","YEAR_END_STAFF_IN_POST_VS_WHOLE_YEAR_AVERAGE_FTE_INCL_ADMIN","2021/22","2022/23","PDF p67 4562 end2023 4589 end2022","PDF p69 4264 avg FTE FY2022/23 4290 FY2021/22","Headcounts on 31 March 2023/2022 4562/4589 (includes directors), FY average FTE 4264/4290; FTE includes direct and other roles and cannot be interpreted as uniformed custody staff counts.","PUBLISHED_DIFFERENT_MEASUREMENT_STATISTICS_CONFIRMED","Do not interchange point-in-time headcount and FY average FTE or treat either as prison officers only.","Find officer role/FTE subtype if present in SPS supplementary staff series."],
            ["MB-076","Scotland SPS Note19 average cost per prisoner place","FY_PLACE_COST_PERIMETER_AND_2021_22_RESTATEMENT_OF_EXCEPTIONAL_COMPARATORS","FY2021/22 originally printed vintage","FY2022/23 2021/22 restated comparators","PDF pp107-108 Note19 target cost 44620 and prior41786 restated from41858","PDF p108 Note19 exceptional-inclusive cost 44677 and prior41858 restated from41786","2022/23 target £44620 excludes capital charges, extraordinary payments and SCCPES escort; full resource basis £50578 includes depreciation/impairment; including exceptional payments £44677. Prior FY 2021/22 corrected 41786 for target and41858 including exceptional, two values explicitly swapped versus earlier printed labels.","EXPLICIT_2021_22_COMPARATOR_RESTATEMENT_AND_DIFFERENT_COST_SCOPE_CONFIRMED","Do not compare uncorrected earlier FY2021/22 vintage to 2022/23, call GBP/place-year GBP/person-day, or sum incompatible cost categories.","Preserve fiscal-year unit/place denominator and inspect audited 2021/22 prior report for original vintage if needed."],
            ["MB-077","Scotland SPS Note22 segment assets","2021_22_PUBLIC_PRIVATE_ESCORT_SEGMENT_NONCURRENT_ASSETS_EXPLICIT_RESTATEMENT","FY2021/22 originally reported","FY2022/23 Note22 restates FY2021/22","PDF p109 Note22 prior 2021/22 public1083576 private136054 escort4245 GBP000","PDF p109 Note22 note explicitly says previous year error","The 2021/22 segment noncurrent assets in FY2022/23 publisher Note22 are starred and labelled corrected due to earlier error. Reclassification/size of old vintage is not established.","RESTATEMENT_EXPLICIT;OLD_UNRESTATED_ORIGINAL_VALUES_UNVERIFIED","Do not treat 2021/22 restated cells as exact earlier-edition published values or infer investments from accounting restatements.","Inspect SPS original 2021/22 report if needed."],
            ["MB-078","Scotland SPS Appendix4 source header","APPENDIX4_2021_22_HEADER_BUT_TABLE_EXPLICIT_2022_23","Published heading Appendix4 2021-22","Table body 2022-23 current and 2021-22 comparison","PDF p114 heading Average Daily Population in Establishment by Type of Custody 2021-22","PDF p114 source body Average Daily Population by Type of Custody 2022-23 with 2021-22 comparison","Literal Appendix4 main heading says 2021-22 although values 2145+2044+3237=7426 are explicitly 2022-23, while 2109+2212+3184=7505 comparator is 2021-22. Preserve verbatim source header and actual column years.","SOURCE_YEAR_MISMATCH_CONFIRMED;EDITORIAL_CAUSE_UNKNOWN","Never assign 7426 or 2145/2044/3237 to 2021-22 because heading says 2021-22.","Keep per-column exact time label, no silent header rewriting."],
            ["MB-079","Scotland SPS Appendix3 source peak populations","GENDER_SPECIFIC_AND_SITE_SPECIFIC_PEAKS_NOT_SIMULTANEOUS","FY2021/22 maxima","FY2022/23 maxima","PDF p113 FY2022/23 male max7299 and female max309","PDF p113 FY2022/23 joint total max7583","7,299 male max+309 female max=7,608, not 7,583 aggregate max; subgroup peaks are independent days. Institution independent maximums must also not be summed to national max. Not a raw source arithmetic mistake.","SOURCE_MAXIMUM_NONADDITIVITY_BY_TIME_CONFIRMED","Do not add separately dated male/female/site peaks or treat 25-person difference as source error.","Use exact daily timestamps if claiming contemporaneous sex peaks."]
          ]
          mfields=list(breaks[0])
          for vals in breaks_new:
            bid,geo,kind,earlier,later,cella,cellb,observation,causal,prohibit,nxt=vals
            row=dict.fromkeys(mfields,"")
            row.update({"break_id":bid,"geography_and_scope":geo,"issue_type":kind,"earlier_period":earlier,"later_period":later,
              "original_source_a":original,"git_sha_a":sha,"original_cell_a":cella,
              "original_source_b":original,"git_sha_b":sha,"original_cell_b":cellb,
              "exact_observation":observation,
              "existing_evidence_artifact":"progress/INT-016_Scotland_SPS_2022_23_primary_source_audit_v1.md;progress/INT-016_finance_staff_population_two_FY_source_series_v1.csv;progress/INT-016_Appendix3_original_20_rows_2021_22_2022_23_v1.csv",
              "causal_explanation_status":causal,"triage_status":"VERIFIED_SOURCE_CONCEPT_OR_ERROR;UNRESOLVED_EXACT_CAUSAL_DETAILS_NOT_ASSUMED",
              "must_not_do":prohibit,"resumption_or_next_check":nxt})
            breaks.append(row)
          assert len(breaks)==79 and len(set(r["break_id"] for r in breaks))==79
          fields=list(indicator[0])
          keep_skip={("Note22_segments","total_segment_net_expenditure"),("Note22_segments","total_noncurrent_assets"),("People_prison","annual_average_all_prisoners")}
          used=0
          for item in series:
            section=item["source_section"];metric=item["indicator"]
            if (section,metric) in keep_skip: continue
            metric_year=item["FY2022_23_source_value"];previous=item["FY2021_22_comparator_as_published"]
            row=dict.fromkeys(fields,"")
            row.update({"record_id":"R%05d"%(1430+used),"source_domain":"SC_SPS_ANNUAL_ACCOUNTS_2022_23",
              "record_type":"INDEPENDENT_ISSUER_TWO_FINANCIAL_YEAR_PRIMARY_SOURCE_SERIES",
              "indicator_code":"SC_SPS_FY_2022_23_"+re.sub("[^A-Za-z0-9_]+","_",section+"_"+metric),
              "indicator_name_original":metric,"indicator_unit":item["source_unit"],"territorial_level":"Scottish Prison Service institutional agency and scoped source segment",
              "temporal_grain":"Scottish_fiscal_year_FY2021_22_and_FY2022_23_except_mar31_balances_or_yearend_headcounts",
              "first_period_recorded":"FY2021/22","last_period_recorded":"FY2022/23",
              "listed_periods_exact":"FY2021/22;FY2022/23","distinct_nominal_years":"2","reporting_window_type":"FY_ANNUAL_OR_MARCH31_STOCK_AS_SOURCE_ANCHOR",
              "coverage_evidence":"VERIFIED_ORIGINAL_128PDF_PAGES_GIT_BLOB_SHA256_ISSUER_EXACT_BINARY_AND_VISUAL_SOURCE_TABLES",
              "numeric_evidence":"FY2021/22="+previous+";FY2022/23="+metric_year,
              "source_reference":"00_catalog/progress/INT-016_Scotland_SPS_2022_23_primary_source_audit_v1.md;00_catalog/progress/INT-016_finance_staff_population_two_FY_source_series_v1.csv",
              "original_source_path":original,"original_git_blob_sha1":sha,
              "source_cell_anchor":item["source_anchor"],
              "important_limitations":item["scope_and_vintage_notes"]+"; FX/capital/stock-vs-flow/financial reporting scope must follow exact source section",
              "observed_value_raw":metric_year,
              "measurement_status":"TWO_YEAR_VERIFIED_PRIMARY_SOURCE_INDEPENDENT_OF_INT015",
              "publication_vintage":"SPS_ANNUAL_FY2022_23_SIGNED_2023_09_12_PDF_PRODUCTION_2023_09_12_PUBLISHER_WEB_POSTED_2024_02",
              "linked_break_ids":("MB-075" if section=="People_staff" else "MB-076" if section=="Note19_cost" else "MB-077" if section=="Note22_segments" and "noncurrent" in metric else "MB-073" if section in ("SoCNE","Note22_segments","SoFP") else "MB-079" if "FY_max" in metric else "MB-078" if section=="People_legal" else "MB-069" if section=="People_prison" else ""),
              "official_upstream_url":upstream,
              "external_binary_identity":"SHA256_"+sha256+"_EXACT_TLS_VALIDATED_BYTE_IDENTICAL_TO_OFFICIAL",
              "field_coverage_status":"SOURCE_SCOPED_TWO_YEAR_EXACT_NUMERIC",
              "number_of_source_records":"2",
              "semantic_code_definition_status":"SOURCE_FINANCIAL_AND_TEMPORAL_SCOPE_DOCUMENTED"
              })
            indicator.append(row);used+=1
          assert used==41,used
          # national 2022 average already in INT015 registry; only new 2021 comparator and independent corroboration is added as separate record
          row=dict.fromkeys(fields,"")
          row.update({"record_id":"R01471","source_domain":"SC_SPS_ANNUAL_ACCOUNTS_2022_23",
            "record_type":"EARLIER_FY2021_22_NATIONAL_MEAN_IN_INDEPENDENT_SPS_REPORT",
            "indicator_code":"SC_SPS_FY2021_22_national_prison_population_annual_mean",
            "indicator_name_original":"Appendix3 all establishment average daily population FY2021/22",
            "indicator_unit":"persons","territorial_level":"Scotland prison custody national",
            "temporal_grain":"Scottish_fiscal_year_average","first_period_recorded":"FY2021/22","last_period_recorded":"FY2021/22","listed_periods_exact":"FY2021/22","distinct_nominal_years":"1",
            "reporting_window_type":"FY_ANNUAL_DAY_WEIGHTED_AGENCY_TOTAL",
            "coverage_evidence":"ORIGINAL_128PDF_PAGES_VERIFIED_WITH_ISSUER_BYTE_IDENTICAL",
            "numeric_evidence":"FY2021/22=7505, FY2022/23=7426 independently confirms existing INT015 value; do not add 7426 twice as independent country count",
            "source_reference":"00_catalog/progress/INT-016_Appendix3_original_20_rows_2021_22_2022_23_v1.csv;00_catalog/progress/INT-016_Scotland_SPS_2022_23_primary_source_audit_v1.md",
            "original_source_path":original,"original_git_blob_sha1":sha,"source_cell_anchor":"PDF p113 Appendix3 national total",
            "important_limitations":"FY2021/22 total7505, sum site rounded printed average=7504; cross-validation FY2022/23 7426 exists in INT015 and is not a distinct Scotland-time observed duplicate",
            "observed_value_raw":"7505","measurement_status":"VERIFIED_ORIGINAL_PRIOR_FY_TOTAL",
            "publication_vintage":"SPS_2022_23_ANNUAL_SIGNED_SEP2023",
            "linked_break_ids":"MB-069;MB-074","official_upstream_url":upstream,
            "external_binary_identity":"SHA256_"+sha256+"_EXACT_ISSUER",
            "field_coverage_status":"PREVIOUS_YEAR_PRIMARY_SOURCE_COMPARATIVE",
            "number_of_source_records":"1"})
          indicator.append(row)
          # One source matrix object covers 20 raw site-age rows for both years, no fabricated independent prison headcounts.
          row=dict.fromkeys(fields,"")
          row.update({"record_id":"R01472","source_domain":"SC_SPS_ANNUAL_ACCOUNTS_2022_23",
            "record_type":"VERIFIED_20_SITE_AGE_SOURCE_ROWS_TWO_YEAR_AVERAGES_AND_MAXIMA_NOT_NATIONAL_ADDITIVE",
            "indicator_code":"SC_SPS_2022_23_2021_22_Appendix3_20_site_age_rows_12_source_columns",
            "indicator_name_original":"Appendix3 average daily population and maximum number by establishment",
            "indicator_unit":"persons_in_source_20x12_site_age_matrix",
            "territorial_level":"Scotland establishments, age categories and sexes; 20 printed source rows",
            "temporal_grain":"FY2021_22_and_FY2022_23_site_averages_and_independently_timed_site_peaks",
            "first_period_recorded":"FY2021/22","last_period_recorded":"FY2022/23",
            "listed_periods_exact":"FY2021/22;FY2022/23","distinct_nominal_years":"2","reporting_window_type":"MIXED_FULL_FY_AND_PARTIAL_OPERATION_SITE_SOURCE_ROWS",
            "coverage_evidence":"FULL_128PAGE_ORIGINAL_HASHED_OFFICIAL_IDENTICAL_APP3_VISUALLY_CHECKED_FOUR_2022_NATIONAL_TOTALS",
            "numeric_evidence":"20_SOURCE_SITE_AGE_ROWS;FY2022/23_INSTITUTION_MEAN_SUM=7437_NATIONAL=7426;FY2021/22_SUM=7504_NATIONAL=7505",
            "source_reference":"00_catalog/progress/INT-016_Appendix3_original_20_rows_2021_22_2022_23_v1.csv;00_catalog/progress/INT-016_Scotland_SPS_2022_23_primary_source_audit_v1.md",
            "original_source_path":original,"original_git_blob_sha1":sha,"source_cell_anchor":"PDF p113 Appendix3 complete two columns six metrics per year and footnotes",
            "important_limitations":"Bella opened Aug2022 Lilias Oct2022 Cornton closed Mar2023; age rows split; raw '-' means not applicable, not true zero; gender/site maxima not same date",
            "measurement_status":"COMPLETE_SOURCE_MATRIX_EVIDENCE_NOT_SINGLE_NUMERIC_TOTAL",
            "publication_vintage":"SPS_SIGNED_SEP2023_POSTED_FEB2024",
            "linked_break_ids":"MB-069;MB-074;MB-079",
            "source_facility_rows":"20","number_of_numeric_facility_cells":str(counts22+counts21),
            "number_of_publisher_blank_facility_cells":str(20*12-counts22-counts21),
            "official_upstream_url":upstream,
            "external_binary_identity":"SHA256_"+sha256+"_EXACT_BYTE_IDENTICAL",
            "field_coverage_status":"FULL_ORIGINAL_RAW_SITE_SEX_AGE_MATRIX_ALL_20_ROWS",
            "number_of_source_records":"20"})
          indicator.append(row)
          assert len(indicator)==1472 and indicator[-1]["record_id"]=="R01472"
          assert len(set(r["record_id"] for r in indicator))==1472
          qa_json={"task":"INT-016","issuer_binary_match":True,"original_sha256":sha256,"original_physical_pages":128,
            "previous_indicators":1429,"new_indicator_rows":len(indicator),"added_indicator_objects":43,
            "paired_fy_metric_source_rows":44,"paired_series_promoted":41,"skipped_duplicate_pairs":[list(k) for k in sorted(keep_skip)],
            "added_earlier_national_year_only":7505,"app3_matrix_objects":1,"app3_rows":20,
            "app3_numeric_source_cells":counts22+counts21,"app3_dash_or_blank_cells":20*12-counts22-counts21,
            "app3_site_mean_sum_FY2022_23":sums_22,"app3_reported_country_mean_FY2022_23":7426,
            "app3_site_mean_sum_FY2021_22":sums_21,"app3_reported_country_mean_FY2021_22":7505,
            "verified_site_partial_periods":["Bella since2022-08-02","Lilias since2022-10-26","Cornton through2023-03-02"],
            "earlier_method_breaks":73,"new_breaks":len(breaks),"MB_added":[x[0] for x in breaks_new],
            "MB069_updated_with_source_period_footnotes":True,
            "independent_source_arithmetic_checks":[{"id":k,"computed":x,"expected":y,"pass":x==y} for k,x,y in qa]
          }
          def serial(rows,fields):
            out=io.StringIO(newline="");writer=csv.DictWriter(out,fieldnames=fields,quoting=csv.QUOTE_ALL,lineterminator="\n",extrasaction="raise")
            writer.writeheader();writer.writerows(rows);return out.getvalue().encode()
          files={root+"INDICATOR_PERIOD_COVERAGE_REGISTRY_v29.csv":serial(indicator,fields),
            root+"METHODOLOGICAL_BREAKS_AND_ANOMALIES_v31.csv":serial(breaks,mfields),
            progress+"INT-016_catalog_integration_QA_v1.json":json.dumps(qa_json,indent=2,ensure_ascii=False).encode()}
          for path,raw in files.items():
            body=json.dumps({"message":"INT016 catalog: "+path.rsplit("/",1)[-1],"branch":"main","content":base64.b64encode(raw).decode()}).encode()
            req=urllib.request.Request("https://api.github.com/repos/"+repo+"/contents/"+path,method="PUT",data=body,headers={**headers,"Content-Type":"application/json"})
            with urllib.request.urlopen(req,timeout=110) as r:print("SAVED",path,len(raw),r.status,flush=True)
          print("SUCCESS",json.dumps({key:qa_json[key] for key in ["new_indicator_rows","new_breaks","paired_series_promoted","app3_numeric_source_cells"]}),flush=True)
          PY
