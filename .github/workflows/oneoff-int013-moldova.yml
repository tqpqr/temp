name: One-off INT-013 Moldova proposed amendment PDF forensic extraction
on:
  push:
    paths:
      - .github/workflows/oneoff-int013-moldova.yml
permissions:
  contents: write
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: SHA-verify original and official document, extract page text
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,sys,subprocess,urllib.request,json,base64,hashlib,io
          repo=os.environ["GH_REPOSITORY"];sha="728a21b5796cf174d1138e38ca622151f15a6e5f"
          src="space-archive/extra/stp8/Moldova_Proiect_modificare_OMJ_41-2023.pdf"
          request=urllib.request.Request("https://api.github.com/repos/"+repo+"/git/blobs/"+sha,headers={"User-Agent":"Archive-Research-Forensic","Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(request,timeout=75) as f:data=json.load(f)
          raw=base64.b64decode(data["content"])
          blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
          assert(len(raw),blob)==(175953,sha),(len(raw),blob)
          assert raw.startswith(b"%PDF")
          with urllib.request.urlopen(urllib.request.Request("https://www.justice.gov.md/sites/default/files/document/attachments/omj_modif_omj_41_2023.pdf",headers={"User-Agent":"Mozilla/5.0 research"}),timeout=70) as r:
           official=r.read()
           pinfo={"url":r.url,"response_status":r.status,"official_bytes":len(official),"official_sha256":hashlib.sha256(official).hexdigest(),"byte_identical":official==raw,"tls":"Python validated TLS"}
          temp="/tmp/forensic_int013_isolated_pypdf"
          subprocess.run([sys.executable,"-m","pip","install","--quiet","--target",temp,"pypdf"],check=True,timeout=90)
          sys.path.insert(0,temp)
          from pypdf import PdfReader
          pdf=PdfReader(io.BytesIO(raw))
          pages=[p.extract_text(extraction_mode="layout") or "" for p in pdf.pages]
          info={"original_path":src,"source_bytes":len(raw),"git_blob_sha1":blob,"sha256":hashlib.sha256(raw).hexdigest(),"number_of_pages":len(pages),"page_text_characters":[len(p) for p in pages],"pdf_core_properties":{str(k):str(v) for k,v in (pdf.metadata or {}).items()},"official_issuer_comparison":pinfo,"engine":"pypdf isolated layout text; not OCR"}
          outputs={
          "INT-013_original_pdf_integrity_publisher_v1.json":json.dumps(info,ensure_ascii=False,indent=2).encode(),
          "INT-013_original_pdf_complete_page_text_v1.md":("\n\n".join("## Original PDF physical page "+str(i+1)+"\n\n"+p for i,p in enumerate(pages))).encode()
          }
          prefix="prison-research-archive/00_catalog/progress/"
          for name,b in outputs.items():
           payload=json.dumps({"message":"forensic INT-013 source original SHA and page-preserving legal amendment inspection: "+name,"content":base64.b64encode(b).decode(),"branch":"main"}).encode()
           req=urllib.request.Request("https://api.github.com/repos/"+repo+"/contents/"+prefix+name,headers={"User-Agent":"ForensicArchiveAudit","Authorization":"Bearer "+os.environ["GH_TOKEN"],"Content-Type":"application/json"},data=payload,method="PUT")
           with urllib.request.urlopen(req,timeout=70) as r: print("SAVED",name,len(b),r.status)
          print("DONE_SOURCE",len(pages),pinfo["byte_identical"])
          PY
